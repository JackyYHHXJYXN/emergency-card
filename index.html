<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="https://jackyyhhxjyxn.github.io/emergency-card/">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急救卡">
<meta name="description" content="急救卡 Emergency Card — 按所在国家自动切换急救电话与急救步骤（中文 / English）">
<title>急救卡 Emergency Card</title>
<script>
/* 在页面绘制前套用日/夜模式，避免闪烁 */
(function(){try{var m=localStorage.getItem("ec_theme");if(m==="light"||m==="dark")document.documentElement.setAttribute("data-theme",m)}catch(e){}})();
/* v0.11.0：外观定稿为 F 临床蓝，投票开关已去掉；清掉旧的外观选择记录 */
(function(){try{localStorage.removeItem("ec_look")}catch(e){}})();
</script>
<style>
/* ==========================================================================
   设计变量（v0.3.2-oc：借鉴 OpenCare ID 的临床分诊设计体系）
   日间 = 默认；夜间 = 跟随系统或手动切换（html[data-theme]）
   规则：正文与按钮文字不小于 17px；文字对比度不低于 4.5:1
   ========================================================================== */
:root{
  --bg-canvas:#F8FAFC; --bg-card:#FFFFFF; --bg-subtle:#F1F5F9;
  --border-card:#CBD5E1; --border-strong:#94A3B8;
  --crimson:#C81E1E; --crimson-fill:#DC2626; --crimson-press:#B91C1C; --crimson-soft:#FEF2F2; --crimson-border:#FECACA;
  --text-primary:#0F172A; --text-secondary:#334155; --text-muted:#475569;
  --emerald:#047857; --emerald-fill:#047857; --emerald-soft:#ECFDF5; --emerald-border:#A7F3D0;
  --amber:#92400E; --amber-soft:#FFFBEB; --amber-border:#FDE68A; --amber-bar:#D97706;
  --link:#1D4ED8; --on-fill:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06); --shadow-md:0 4px 12px rgba(15,23,42,.08);
  --shadow-red:0 6px 16px rgba(220,38,38,.28);
  --radius-lg:14px; --radius-md:10px; --radius-sm:6px;
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
  --font-num:"DIN Alternate","DIN Next LT Pro","Bahnschrift","Roboto Condensed",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --nav-h:64px; --fs:1; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-canvas:#090D16; --bg-card:#111827; --bg-subtle:#1E293B;
  --border-card:#334155; --border-strong:#475569;
  --crimson:#F87171; --crimson-fill:#DC2626; --crimson-press:#B91C1C; --crimson-soft:rgba(239,68,68,.14); --crimson-border:rgba(239,68,68,.4);
  --text-primary:#F8FAFC; --text-secondary:#E2E8F0; --text-muted:#A3B1C6;
  --emerald:#34D399; --emerald-fill:#047857; --emerald-soft:rgba(16,185,129,.14); --emerald-border:rgba(16,185,129,.4);
  --amber:#FBBF24; --amber-soft:rgba(245,158,11,.14); --amber-border:rgba(245,158,11,.4); --amber-bar:#F59E0B;
  --link:#93C5FD; --shadow-sm:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 6px 16px rgba(0,0,0,.5); --shadow-red:0 6px 16px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#090D16; --bg-card:#111827; --bg-subtle:#1E293B;
  --border-card:#334155; --border-strong:#475569;
  --crimson:#F87171; --crimson-fill:#DC2626; --crimson-press:#B91C1C; --crimson-soft:rgba(239,68,68,.14); --crimson-border:rgba(239,68,68,.4);
  --text-primary:#F8FAFC; --text-secondary:#E2E8F0; --text-muted:#A3B1C6;
  --emerald:#34D399; --emerald-fill:#047857; --emerald-soft:rgba(16,185,129,.14); --emerald-border:rgba(16,185,129,.4);
  --amber:#FBBF24; --amber-soft:rgba(245,158,11,.14); --amber-border:rgba(245,158,11,.4); --amber-bar:#F59E0B;
  --link:#93C5FD; --shadow-sm:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 6px 16px rgba(0,0,0,.5); --shadow-red:0 6px 16px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-canvas);color:var(--text-primary);font:calc(17px * var(--fs))/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;
  padding-top:var(--top-real,calc(56px + env(safe-area-inset-top)));
  padding-bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
h1:focus,h2:focus{outline:none}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.ic.s{width:20px;height:20px}

/* ---------- 顶栏 ---------- */
header.top{position:fixed;top:0;left:0;right:0;z-index:30;background:var(--bg-card);border-bottom:1px solid var(--border-card);
  box-shadow:var(--shadow-sm);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:8px;min-height:56px}
.logo{width:30px;height:30px;flex:none;display:block}
.brand{font-weight:800;font-size:calc(19px * var(--fs));letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;min-width:0}
.ibtn{min-height:44px;min-width:44px;padding:0 12px;border-radius:var(--radius-md);background:var(--bg-subtle);border:1px solid var(--border-card);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:calc(17px * var(--fs));white-space:nowrap;flex:none;color:var(--text-primary)}
.ibtn:active{transform:scale(.97)}

/* ---------- 底部四栏导航 ---------- */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg-card);border-top:1px solid var(--border-card);
  box-shadow:0 -2px 10px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom)}
.bnav-in{max-width:600px;margin:0 auto;min-height:var(--nav-h);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px 6px}
.tab{border-radius:var(--radius-md);color:var(--text-muted);font-size:calc(17px * var(--fs));font-weight:700;line-height:1.1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;white-space:nowrap}
.tab .ic{width:22px;height:22px}
.tab[aria-current="page"]{background:var(--bg-subtle);color:var(--text-primary)}
/* v0.3.3：红色只留给"拨打"本身；呼救栏目只保留红色图标，不再整块变红 */
.tab.sos .ic{color:var(--crimson)}
body.sheet-on nav.bnav{display:none}

/* ---------- 呼叫栏（导航上方，任何页面一键拨打） ---------- */
.dock{position:fixed;left:0;right:0;z-index:45;bottom:var(--nav-real,calc(var(--nav-h) + env(safe-area-inset-bottom)));
  padding:10px 14px 8px;background:linear-gradient(color-mix(in srgb,var(--bg-canvas) 0%,transparent),var(--bg-canvas) 10px)}
body.sheet-on .dock{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.dock>*{max-width:572px;margin-left:auto;margin-right:auto}
.call{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--crimson-fill);color:var(--on-fill);
  border-radius:var(--radius-lg);padding:6px 6px 6px 16px;min-height:58px;box-shadow:var(--shadow-red)}
.call:active{background:var(--crimson-press);transform:scale(.99)}
.call>span:first-child{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px}
.call .lbl{font-size:calc(17px * var(--fs));font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;order:2;min-width:0}
.call .num{font-family:var(--font-num);font-size:calc(32px * var(--fs));font-weight:800;letter-spacing:1.5px;line-height:1;font-variant-numeric:tabular-nums;order:1;flex:none}
.call .ico{width:46px;height:46px;border-radius:11px;background:#FFFFFF;color:#DC2626;display:grid;place-items:center;flex:none}
.snav{display:grid;grid-template-columns:1fr 1.7fr;gap:10px;margin-bottom:10px}
.snav button{min-height:58px;border-radius:var(--radius-lg);font-size:calc(20px * var(--fs));font-weight:800;display:flex;align-items:center;justify-content:center;gap:4px}
.snav .pv{background:var(--bg-card);border:1.5px solid var(--border-strong)}
.snav .pv:disabled{opacity:.4}
.snav .nx{background:var(--text-primary);color:var(--bg-canvas)}

/* ---------- 卡片（临床卡片体系） ---------- */
.card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.card.crit{border-left:5px solid var(--crimson-fill)}
.kick{font-size:calc(17px * var(--fs));font-weight:800;letter-spacing:.3px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3}
.kick.red{color:var(--crimson)}
.kick em{font-style:normal;font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--crimson)}
.secH{font-size:calc(17px * var(--fs));font-weight:800;letter-spacing:.3px;color:var(--text-muted);margin:26px 4px 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.secH b{color:var(--text-primary);font-size:calc(20px * var(--fs))}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:calc(17px * var(--fs));font-weight:700;padding:1px 10px 1px 8px;border-radius:99px;white-space:nowrap;border:1px solid}
.badge .ic{width:16px;height:16px;stroke-width:2.6}
.badge.A{background:var(--emerald-soft);color:var(--emerald);border-color:var(--emerald-border)}
.badge.B{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-border)}
.badge.C{background:var(--crimson-soft);color:var(--crimson);border-color:var(--crimson-border)}
.mut{color:var(--text-muted);font-size:calc(17px * var(--fs))}
.muted{color:var(--text-muted);font-size:calc(17px * var(--fs))}

/* ---------- 红色主信息块（借鉴 OpenCare 血型块的信息层级） ---------- */
.hrow{display:flex;align-items:stretch;justify-content:space-between;gap:14px}
.hinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.place{font-size:calc(26px * var(--fs));font-weight:900;line-height:1.2;letter-spacing:-.2px;display:flex;align-items:center;gap:8px;word-break:break-word}
.place span[aria-hidden]{font-size:calc(26px * var(--fs))}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.tbtn{align-self:flex-start;min-height:44px;padding:0 2px;color:var(--link);font-weight:700;font-size:calc(17px * var(--fs));display:inline-flex;align-items:center;gap:2px;margin-top:2px}
.rblock{width:108px;min-height:108px;flex:none;border-radius:12px;background:var(--crimson-fill);color:var(--on-fill);text-decoration:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 6px;text-align:center;box-shadow:var(--shadow-red)}
a.rblock:active{background:var(--crimson-press);transform:scale(.98)}
.rblock .rk{font-size:calc(17px * var(--fs));font-weight:800;letter-spacing:.5px;line-height:1.15}
.rblock .rv{font-family:var(--font-num);font-size:calc(38px * var(--fs));font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:1px;word-break:break-all}
.rblock .rv.long{font-family:var(--font-sans);font-size:calc(20px * var(--fs));letter-spacing:0;line-height:1.2}
.rblock .rc{display:flex;align-items:center;gap:4px;font-size:calc(17px * var(--fs));font-weight:700;opacity:.95;white-space:nowrap}
.rblock .rc svg{width:16px;height:16px}
.rblock.empty{background:var(--bg-subtle);color:var(--text-muted);border:1.5px dashed var(--border-strong);box-shadow:none}

/* ---------- v0.3.3 位置条（一行，取代首页大红块；拨打统一交给底部呼叫栏） ---------- */
.lcard{padding:10px 8px 10px 14px}
.lrow{display:flex;align-items:center;gap:12px}
.lflag{font-size:calc(32px * var(--fs));line-height:1;flex:none}
.linfo{flex:1;min-width:0}
.lname{font-size:calc(22px * var(--fs));font-weight:900;line-height:1.2;letter-spacing:-.2px;word-break:break-word}
.lmeta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin-top:2px}
.lrow .tbtn{align-self:center;margin:0;padding:0 8px;flex:none}

/* ---------- 两问分诊 ---------- */
.tri h1{font-size:calc(30px * var(--fs));line-height:1.22;margin:6px 0 4px;letter-spacing:.2px}
.tri p{margin:0 0 14px;color:var(--text-secondary)}
.tri-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{min-height:96px;border-radius:var(--radius-lg);padding:12px;font-size:calc(22px * var(--fs));font-weight:800;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;transition:transform .08s}
.big small{font-size:calc(17px * var(--fs));font-weight:600;opacity:.95}
.big.no{background:var(--crimson-fill);color:var(--on-fill);box-shadow:var(--shadow-red)}
.big.no:active{background:var(--crimson-press)}
.big.yes{background:var(--bg-subtle);border:2px solid var(--border-strong);color:var(--text-primary)}
.big:active{transform:scale(.98)}
.link{color:var(--link);font-weight:700;min-height:48px;padding:0 2px;margin-top:6px;display:inline-flex;align-items:center;gap:4px}

/* ---------- 提示条 ---------- */
.note{display:flex;gap:10px;font-size:calc(17px * var(--fs));line-height:1.5;background:var(--amber-soft);border:1px solid var(--amber-border);border-left:4px solid var(--amber-bar);
  border-radius:var(--radius-md);padding:12px 14px;margin:0 0 12px;color:var(--text-primary)}
.note .ic{color:var(--amber);margin-top:2px}

/* ---------- 急救卡网格 ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:14px;text-align:left;min-height:132px;
  display:flex;flex-direction:column;justify-content:flex-start;gap:12px;box-shadow:var(--shadow-sm)}
.tile:active{transform:scale(.98);border-color:var(--border-strong)}
.sg{width:44px;height:44px;border-radius:10px;background:var(--emerald-fill);color:#FFFFFF;display:grid;place-items:center;flex:none}
.sg .ic{width:26px;height:26px}
.tile b{font-size:calc(18px * var(--fs));line-height:1.3;display:block;font-weight:800}
.tile small{color:var(--text-muted);font-size:calc(17px * var(--fs));line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.tile.top{grid-column:1/-1;background:var(--crimson-fill);border-color:var(--crimson-fill);color:var(--on-fill);flex-direction:row;align-items:center;min-height:92px;gap:16px;box-shadow:var(--shadow-red)}
.tile.top .sg{width:56px;height:56px;border-radius:14px;background:#FFFFFF;color:#DC2626}
.tile.top .sg .ic{width:32px;height:32px;stroke-width:2.2}
.tile.top b{font-size:calc(20px * var(--fs))}
.tile.top small{color:#FFFFFF;opacity:.95}
.tile.top .chev{margin-left:auto}
/* v0.9.0：ⓘ 说明折叠、待签审标记 */
details.ifo{margin-top:10px;border-top:1px solid var(--border-card)}
details.ifo summary{min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--text-muted);cursor:pointer;list-style:none}
details.ifo summary::-webkit-details-marker{display:none}
details.ifo .ifb p{margin:0 0 8px}
details.ifo .ifb{padding-bottom:4px;color:var(--text-muted)}
.pend{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:999px;border:1px solid #B45309;color:#B45309;font-style:normal;font-weight:800;font-size:calc(14px * var(--fs))}
.pendN{margin-top:10px;padding:8px 12px;border-radius:10px;border:1px solid #B45309;color:#B45309;font-weight:700}

/* ---------- 当地号码 ---------- */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.n{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:2px;text-decoration:none;color:var(--text-primary);
  border:1px solid var(--border-card);border-radius:var(--radius-md);padding:10px 14px;min-height:64px;background:var(--bg-subtle)}
.n:active{border-color:var(--border-strong)}
.n span{font-size:calc(17px * var(--fs));color:var(--text-muted);line-height:1.25}
.n b{font-family:var(--font-num);font-size:calc(24px * var(--fs));font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.5px}
.notes{margin:12px 0 0;padding:0;list-style:none;font-size:calc(17px * var(--fs))}
.notes li{padding-left:18px;position:relative;margin-top:8px}
.notes li:before{content:"";position:absolute;left:2px;top:.68em;width:7px;height:7px;border-radius:2px;background:var(--emerald-fill)}
.say{margin:0;padding:0;list-style:none;counter-reset:s}
.say li{counter-increment:s;display:flex;gap:12px;padding:10px 0;font-size:calc(17px * var(--fs));border-bottom:1px solid var(--border-card)}
.say li:last-child{border-bottom:0}
.say li:before{content:counter(s);flex:none;width:28px;height:28px;border-radius:99px;background:var(--crimson-fill);color:#FFFFFF;
  font-family:var(--font-num);font-weight:800;font-size:calc(17px * var(--fs));display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 16px;border-radius:var(--radius-md);
  background:var(--text-primary);color:var(--bg-canvas);font-weight:800;width:100%;margin-top:12px;text-decoration:none;text-align:center}
.btn:active{opacity:.9}
.btn.ghost{background:var(--bg-subtle);color:var(--text-primary);border:1px solid var(--border-strong)}
.btn.red{background:var(--crimson-fill);color:#FFFFFF}
.btn.grn{background:var(--emerald-fill);color:#FFFFFF}
/* v0.5.1 附近的急诊医院 */
.hosp .hb{display:grid;gap:10px;margin-top:4px}.hosp .hb .btn{margin-top:0}
.hosp .ht{font-size:calc(17px * var(--fs));line-height:1.5;color:var(--text-muted);margin:10px 0 0}
.hosp .hw{font-size:calc(17px * var(--fs));line-height:1.5;font-weight:700;margin:0 0 12px}
.hosp .hs{font-size:calc(17px * var(--fs));color:var(--text-muted);margin-top:8px;min-height:1em}
.hentry{margin:0 0 12px}.hentry .btn{margin-top:0}
.loc{font-family:var(--font-num);font-size:calc(24px * var(--fs));font-weight:800;font-variant-numeric:tabular-nums;margin:12px 0 2px;word-break:break-all;
  background:var(--bg-subtle);border:1px solid var(--border-card);border-radius:8px;padding:10px 12px}
.src{font-size:calc(17px * var(--fs));color:var(--text-muted);margin-top:14px;word-break:break-word}
details.srcd>summary{list-style:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-weight:700}
details.srcd>summary::-webkit-details-marker{display:none}
details.srcd>summary:after{content:"›";font-size:1.3em;line-height:1;transition:transform .15s}
details.srcd[open]>summary:after{transform:rotate(90deg)}
details.srcd .srcb{padding:2px 0 4px}

/* ---------- 我的卡 ---------- */
.pname{font-size:calc(26px * var(--fs));font-weight:900;line-height:1.2;letter-spacing:-.2px;word-break:break-word}
.pname.ph{color:var(--text-muted);font-weight:700}
.fv{font-size:calc(22px * var(--fs));font-weight:700;line-height:1.35;margin-top:4px;word-break:break-word}
.fv.none{color:var(--text-muted);font-size:calc(17px * var(--fs));font-weight:600}
.frow{padding:10px 0;border-bottom:1px solid var(--border-card)}
.frow:last-child{border-bottom:0;padding-bottom:0}
.frow:first-child{padding-top:0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.duo .card{margin:0}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
label{display:block;font-size:calc(17px * var(--fs));font-weight:700;color:var(--text-secondary);margin-top:12px}
input,textarea{width:100%;font:inherit;font-weight:600;color:var(--text-primary);background:var(--bg-canvas);border:1px solid var(--border-strong);border-radius:9px;padding:12px;margin-top:4px;min-height:50px}
input:focus,textarea:focus{outline:2px solid var(--crimson-fill);outline-offset:0;border-color:var(--crimson-fill)}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.bchoice{min-height:46px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-canvas);font-size:calc(17px * var(--fs));font-weight:800;color:var(--text-primary)}
.bchoice[aria-pressed="true"]{background:var(--crimson-fill);color:#FFFFFF;border-color:var(--crimson-fill)}
.tip{border-top:1px solid var(--border-card);padding-top:14px;margin-top:14px}
.tip b{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tip b .ic{color:var(--emerald)}
.tip p{margin:8px 0 0}
.ml{display:flex;gap:12px;align-items:flex-start}
.ml .ic{color:var(--crimson);margin-top:3px}
.ml b{display:block;font-size:calc(18px * var(--fs))}

/* ---------- 反馈 / 设置 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip2{min-height:46px;padding:0 16px;border-radius:99px;border:1px solid var(--border-strong);background:var(--bg-subtle);font-weight:700;font-size:calc(17px * var(--fs));color:var(--text-primary)}
.chip2[aria-pressed="true"]{background:var(--text-primary);color:var(--bg-canvas);border-color:var(--text-primary)}
.mlq{border:1px solid var(--crimson-border);background:var(--crimson-soft);border-radius:var(--radius-md);padding:12px 14px;margin-top:12px}
.mlq p{margin:6px 0 0}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.seg3 button{min-height:50px;border-radius:var(--radius-md);border:2px solid var(--border-card);background:var(--bg-card);font-weight:800;font-size:calc(17px * var(--fs));display:flex;align-items:center;justify-content:center;gap:6px}
.seg3 button[aria-pressed="true"]{border-color:var(--crimson-fill);background:var(--crimson-soft)}
details.sl summary{min-height:48px;font-weight:800;cursor:pointer;display:flex;align-items:center}
.srcs{font-size:calc(17px * var(--fs));color:var(--text-muted);padding-left:26px;margin:8px 0 0}
.srcs li{margin-top:6px;word-break:break-word}
.srcs.ctl{list-style:none;padding-left:0}.srcs.ctl .badge{padding:0 8px}
.stag{display:inline-block;font-size:.85em;font-weight:700;line-height:1.35;padding:0 7px;border-radius:99px;border:1px solid var(--border-card);color:var(--text-muted);white-space:nowrap}
.stag.gov{color:var(--emerald);border-color:var(--emerald-border);background:var(--emerald-soft)}
.stag.guide{color:var(--link);border-color:currentColor}
.stag.other{color:var(--amber);border-color:var(--amber-border);background:var(--amber-soft)}
footer{font-size:calc(17px * var(--fs));color:var(--text-muted);margin:22px 4px 0;line-height:1.6}

/* ---------- 全屏层（急救步骤、选国家、首次确认） ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg-canvas);overflow:auto;display:none;padding-bottom:calc(var(--dock-real,190px) + 24px)}
.sheet.on{display:block}
.shead{position:sticky;top:0;background:var(--bg-card);border-bottom:1px solid var(--border-card);box-shadow:var(--shadow-sm);
  padding:calc(6px + env(safe-area-inset-top)) 14px 6px;margin:0 -14px;z-index:2;display:flex;align-items:center;gap:8px}
.shead .sp{flex:1}
.back,.chip{min-height:48px;padding:0 14px;border-radius:var(--radius-md);background:var(--bg-subtle);border:1px solid var(--border-card);font-weight:700;font-size:calc(17px * var(--fs));white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;color:var(--text-primary)}
.back{padding-left:8px}
.chip[aria-pressed="true"]{background:var(--crimson-fill);color:#FFFFFF;border-color:var(--crimson-fill)}
.seg{display:inline-flex;background:var(--bg-subtle);border:1px solid var(--border-card);border-radius:var(--radius-md);padding:3px;min-height:50px}
.seg span{display:inline-flex;align-items:center;padding:0 12px;border-radius:8px;font-weight:700;font-size:calc(17px * var(--fs));color:var(--text-muted);white-space:nowrap}
.seg.wide{display:flex;width:100%;margin-top:14px}
.seg.wide span{flex:1;justify-content:center}
.seg span.on{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-sm);border:1px solid var(--border-card)}
.ttl{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.ttl .sg{width:52px;height:52px;border-radius:12px}
.ttl .sg .ic{width:30px;height:30px}
.ttl .sg.red{background:var(--crimson-fill)}
.sheet h1{font-size:calc(26px * var(--fs));line-height:1.22;margin:0;font-weight:900}
.when{background:var(--amber-soft);border:1px solid var(--amber-border);color:var(--text-primary);border-radius:var(--radius-md);padding:12px 14px;font-size:calc(17px * var(--fs));font-weight:700}
.status{display:flex;align-items:center;flex-wrap:wrap;gap:6px;color:var(--text-muted);font-size:calc(17px * var(--fs));margin-top:10px}
.status .ic{color:var(--emerald)}
.prog{display:flex;gap:4px;margin:16px 0 14px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--border-card)}
.prog i.d{background:var(--crimson-fill)}
.stepK{font-size:calc(17px * var(--fs));font-weight:800;color:var(--text-muted);font-variant-numeric:tabular-nums}
.stepTxt{font-size:calc(27px * var(--fs));line-height:1.4;font-weight:800;margin:6px 0 0;letter-spacing:.2px}
.stepTxt b{color:var(--crimson);font-family:var(--font-num);font-size:1.2em;font-variant-numeric:tabular-nums}
.fig{display:block;width:100%;max-width:360px;height:auto;margin:16px auto 2px;border-radius:12px;border:1px solid var(--border-card)}
details.dd{margin-top:16px;background:var(--bg-card);border:1px solid var(--border-card);border-left:5px solid var(--crimson-fill);border-radius:var(--radius-lg)}
details.dd summary{min-height:54px;padding:12px 16px;font-weight:800;color:var(--crimson);cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
details.dd summary::-webkit-details-marker{display:none}
details.dd summary .chev{margin-left:auto;color:var(--text-muted);transition:transform .15s}
details.dd[open] summary .chev{transform:rotate(90deg)}
details.dd ul{margin:0;padding:0 16px 16px 38px}
details.dd li{margin-top:6px}
.steps{list-style:none;margin:16px 0 0;padding:0;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:14px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);
  padding:16px 14px;margin-bottom:8px;font-size:calc(18px * var(--fs));line-height:1.5;font-weight:600}
.steps li:before{content:counter(st);flex:none;width:34px;height:34px;border-radius:99px;background:var(--crimson-fill);color:#FFFFFF;
  font-family:var(--font-num);font-weight:800;font-size:calc(19px * var(--fs));display:grid;place-items:center}
.steps li>span{flex:1;min-width:0}
.steps li b{color:var(--crimson);font-family:var(--font-num)}
.dont{background:var(--crimson-soft);border:1px solid var(--crimson-border);border-left:5px solid var(--crimson-fill);border-radius:var(--radius-lg);padding:14px 16px;margin-top:12px}
.dont b{color:var(--crimson);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dont ul{margin:0;padding-left:22px}
.dont li{margin-top:4px}
.extra{background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:14px 16px;margin-top:12px;font-size:calc(17px * var(--fs))}
.metro{display:flex;align-items:center;gap:14px;margin-top:12px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);padding:12px 12px 12px 14px}
.metro .ml{flex:1;font-weight:800;line-height:1.25;display:block}
.dot{width:48px;height:48px;border-radius:50%;background:var(--crimson-fill);flex:none;position:relative;display:grid;place-items:center;color:#fff}
.dot:after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--crimson-fill);opacity:0}
.dot.beat{animation:pump .16s ease-out}
.dot.beat:after{animation:ring .5s ease-out}
@keyframes pump{from{transform:scale(1.14)}to{transform:scale(1)}}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}

/* 首次确认国家 */
.cf{text-align:center;padding-top:calc(24px + env(safe-area-inset-top))}
.cf .mk{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-muted);font-weight:700}
.cf .mk svg{width:26px;height:26px}
.cf .flag{width:104px;height:104px;margin:24px auto 14px;border-radius:50%;background:var(--bg-card);border:1px solid var(--border-card);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:calc(56px * var(--fs));line-height:1}
.cf h1{font-size:calc(22px * var(--fs))!important;font-weight:700!important;color:var(--text-muted)}
.cf .cn{font-size:calc(32px * var(--fs));font-weight:900;line-height:1.2;margin:4px 0 14px}
.cf .rblock{margin:0 auto;width:132px;min-height:120px}
.cf p.muted{margin:16px 8px 6px}
.cf .btn{min-height:62px;font-size:calc(19px * var(--fs))}

.list{margin-top:10px;background:var(--bg-card);border:1px solid var(--border-card);border-radius:var(--radius-lg);overflow:hidden}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:58px;padding:12px 16px;border-bottom:1px solid var(--border-card);text-align:left;font-size:calc(18px * var(--fs));gap:10px}
.opt:last-child{border-bottom:0}
.opt:active{background:var(--bg-subtle)}
.opt b{font-family:var(--font-num);font-size:calc(20px * var(--fs));font-variant-numeric:tabular-nums;color:var(--crimson)}
.pickh{margin-top:14px!important}

/* ---------- v0.4.0：路人大字卡 / 锁屏图片 / 清除数据 ---------- */
.helpbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg-card);border:2px solid var(--crimson-fill);border-radius:var(--radius-lg);
  padding:14px;min-height:72px;margin:6px 0 12px;box-shadow:var(--shadow-sm);color:var(--text-primary)}
.helpbtn b{display:block;font-size:calc(20px * var(--fs));line-height:1.25}
.nfc{border-top:1px solid var(--border-card);padding:10px 0 4px;margin-top:8px}
.nfn{font-size:calc(18px * var(--fs));word-break:break-all}.nfn span{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.nfb{display:flex;flex-wrap:wrap;gap:8px}.nfb .btn{flex:1 1 6em;width:auto;min-width:0;margin-top:8px;white-space:nowrap}.nfb .btn.nfp{flex:0 0 64px}
.nfloc{margin:6px 0 4px;font-weight:600}.nfloc.ok{color:var(--green,#0B7B55)}.nfloc.no{color:var(--crimson)}
#nfTxt{width:100%;box-sizing:border-box;font:inherit;font-size:calc(17px * var(--fs));line-height:1.45;padding:10px;border-radius:8px;border:1px solid var(--border-card);background:var(--bg-card);color:var(--text-primary);margin-top:6px}
.helpbtn small{display:block;color:var(--text-muted);font-size:calc(17px * var(--fs))}
.helpbtn .sg{background:var(--crimson-fill)}
.helpbtn .chev{margin-left:auto;color:var(--text-muted)}
.pb{margin-top:14px;background:#FFFFFF;color:#111111;border:4px solid #DC2626;border-radius:18px;padding:20px 18px;text-align:center}
.pb .pbl{font-size:calc(30px * var(--fs));line-height:1.3;font-weight:900;margin:0}
.pb .pbl+.pbl{margin-top:14px;padding-top:14px;border-top:2px solid #E5E7EB}
.pb .pbn{font-family:var(--font-num);font-size:calc(84px * var(--fs));line-height:1;font-weight:900;color:#B91C1C;letter-spacing:4px;margin:18px 0 6px;font-variant-numeric:tabular-nums;word-break:break-all}
.pb .pbc{font-size:calc(20px * var(--fs));font-weight:800;color:#374151}
.n.nolink{cursor:default}
.n .nh{font-size:calc(17px * var(--fs));color:var(--amber);font-weight:700}
.wallimg{display:block;width:100%;max-width:300px;margin:12px auto 0;border-radius:22px;border:1px solid var(--border-card);box-shadow:var(--shadow-md)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.seg2 button{min-height:50px;border-radius:var(--radius-md);border:2px solid var(--border-card);background:var(--bg-card);font-weight:800;font-size:calc(17px * var(--fs))}
.seg2 button[aria-pressed="true"]{border-color:var(--crimson-fill);background:var(--crimson-soft)}
.urlbox{font-family:var(--font-num);font-size:calc(17px * var(--fs));word-break:break-all;background:var(--bg-subtle);border:1px solid var(--border-card);border-radius:8px;padding:10px 12px;margin-top:10px}
.btn.warn{background:var(--bg-subtle);color:var(--crimson);border:1.5px solid var(--crimson-border)}
.btn.warn[data-armed="1"]{background:var(--crimson-fill);color:#FFFFFF;border-color:var(--crimson-fill)}


/* ---------- v0.4.1 ---------- */
.lp{margin:0 0 14px;padding:0 0 14px;border-bottom:2px solid #E5E7EB}
.lp .lpk{font-size:calc(17px * var(--fs));font-weight:800;color:#B91C1C;letter-spacing:.3px}
.lp .lpt{font-size:calc(34px * var(--fs));line-height:1.3;margin-top:6px}
.lp .lpr{font-size:calc(18px * var(--fs));color:#374151;margin-top:4px;font-style:italic}
.lp .lps{font-size:calc(15px * var(--fs));color:#4B5563;margin-top:8px;line-height:1.4;word-break:break-word}
.lp .lps a{color:#1D4ED8}
.mc{margin-top:14px;background:#FFFFFF;color:#111111;border:4px solid #DC2626;border-radius:18px;padding:6px 16px}
.mc .mcf{padding:14px 0;border-bottom:2px solid #E5E7EB}
.mc .mcf:last-child{border-bottom:0}
.mc .mcl{font-size:calc(22px * var(--fs));font-weight:900;line-height:1.3;word-break:break-word;color:#111111}
.mc .mcf.crit .mcl{color:#B91C1C}
.mc .mce{font-size:calc(15px * var(--fs));font-weight:700;color:#4B5563;margin-top:2px;line-height:1.35}
.mc .mcv{font-size:calc(26px * var(--fs));font-weight:800;line-height:1.35;margin-top:6px;word-break:break-word;white-space:pre-wrap}
.mc .mcv.bt{font-family:var(--font-num);font-size:calc(40px * var(--fs));font-weight:900;color:#B91C1C}
.mc .mcv.none{font-size:calc(17px * var(--fs));color:#6B7280;font-weight:600}
.mc a.btn{margin-top:10px}
.mcs{font-size:calc(15px * var(--fs));color:var(--text-muted);margin-top:10px;line-height:1.45;word-break:break-word}
.mcs .pend{display:inline-block;font-weight:800;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:0 6px}
.lp .pend{display:inline-block;font-weight:800;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:0 6px}
.about .vrow{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-top:4px}
.about .vrow b{font-size:calc(22px * var(--fs));font-family:var(--font-num)}
.about .vrow span{color:var(--text-muted)}
.diag{font-family:var(--font-num);line-height:1.6;word-break:break-all;padding-bottom:6px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.seg4 button{min-height:50px;border-radius:var(--radius-md);border:2px solid var(--border-card);background:var(--bg-card);font-weight:800;font-size:calc(16px * var(--fs));padding:0 4px;line-height:1.15}
.seg4 button[aria-pressed="true"]{border-color:var(--crimson-fill);background:var(--crimson-soft)}
.wallfull{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;overflow:auto}
.wallfull .wfbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#111827;color:#fff}
.wallfull img{display:block;width:100%;max-width:520px;margin:0 auto;height:auto}
html.bigtext .grid{grid-template-columns:1fr}
html.bigtext .tri-b{grid-template-columns:1fr}
html.bigtext .seg4{grid-template-columns:1fr 1fr}
html.bigtext .tab{font-size:17px}
html.bigtext .lrow{flex-wrap:wrap}
html.bigtext .lrow .tbtn{margin-left:auto}
html.bigtext .call .num{font-size:32px}
body{padding-bottom:calc(var(--nav-real,calc(var(--nav-h) + env(safe-area-inset-bottom))) + var(--dock-real,96px) + 16px)}

/* ---------- v0.4.3：安卓大字不重叠 ----------
   安卓（微信、各品牌自带浏览器、WebView）会按"系统/微信字体大小"直接放大文字，页面脚本读不到。
   做法：①布局本身可换行，任何字号都不叠；②用隐藏的“国”字实测真实放大倍数，≥1.12 加 bigtext，≥1.4 加 hugetext，≥1.7 加 maxtext；
   ③顶栏、底栏、呼叫栏的实际高度由脚本实测后写进 --top-real / --nav-real / --dock-real，不再写死。 */
#ecProbe{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;font-family:var(--font-sans);font-size:calc(100px * var(--fs));line-height:1;white-space:nowrap;font-weight:400;letter-spacing:0}
main,.sheet,.dock{overflow-wrap:break-word}
.grid>*,.tri-b>*,.nums>*,.duo>*,.snav>*{min-width:0}
.tile b,.tile small,.big{overflow-wrap:anywhere}
#brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
.lrow{flex-wrap:wrap;row-gap:4px}
.linfo{flex:1 1 9em}
.lname,.lmeta .mut{word-break:keep-all;overflow-wrap:anywhere}
/* 两个分诊按钮尽量并排（一屏内都看得到）；文字放大到 1.7 倍以上才上下排 */
html.bigtext:not(.maxtext) .tri-b{grid-template-columns:1fr 1fr}
html.bigtext .big{padding:10px 8px}
.lmeta .badge{max-width:100%;white-space:normal}
.lrow .tbtn{margin-left:auto}
.call>span:first-child{align-items:center}
html.bigtext .call .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
html.bigtext .shead{flex-wrap:wrap;row-gap:6px}
html.bigtext .shead .chip,html.bigtext .shead .back{white-space:normal;max-width:100%;text-align:left;line-height:1.2}
html.bigtext .seg span{white-space:normal;text-align:center;line-height:1.2;padding:4px 10px}
html.bigtext .nums{grid-template-columns:1fr}
html.bigtext .rblock{width:auto;min-width:108px;padding:8px 12px}
html.bigtext .rblock .rv{word-break:keep-all}
html.bigtext .bgrid{grid-template-columns:repeat(auto-fit,minmax(3.4em,1fr))}
html.bigtext .tab{line-height:1.05;padding:2px 0}
html.bigtext .tile small{-webkit-line-clamp:3}
html.bigtext .metro{flex-wrap:wrap}
html.bigtext .metro .chip{white-space:normal;max-width:100%;margin-left:auto}
html.hugetext .seg3,html.hugetext .seg2,html.hugetext .seg4,html.hugetext .snav{grid-template-columns:1fr}
html.hugetext .tab .ic{width:18px;height:18px}
html.hugetext .duo{grid-template-columns:1fr}
html.hugetext .ibtn{padding:0 8px}
@media (max-width:350px){.pb .pbl{font-size:calc(26px * var(--fs))}.pb .pbn{font-size:calc(68px * var(--fs))}}
@media (max-width:350px){.tri h1{font-size:calc(26px * var(--fs))}.big{font-size:calc(20px * var(--fs))}.stepTxt{font-size:calc(24px * var(--fs))}.call .num{font-size:calc(30px * var(--fs))}.seg span{padding:0 9px}.rblock{width:96px}.rblock .rv{font-size:calc(32px * var(--fs))}.place{font-size:calc(22px * var(--fs))}.tab{font-size:calc(15px * var(--fs))}.lname{font-size:calc(20px * var(--fs))}.lflag{font-size:calc(28px * var(--fs))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header.top,nav.bnav,.dock,.btn,.ibtn,.shead,#fb{display:none!important}body{background:#fff;padding:0}}

/* ---------- v0.6.0：帮别人呼救 / 发病时间 / 高危勾选 / 多档案 / 交接页 / 打印 ---------- */
.rkgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.rkc{min-height:50px;text-align:left;padding:10px 14px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--bg-canvas);font-weight:700;font-size:calc(17px * var(--fs));color:var(--text-primary);display:flex;align-items:center;gap:12px;line-height:1.3}
.rkc:before{content:"";width:22px;height:22px;border-radius:6px;border:2px solid var(--border-strong);flex:none;background:var(--bg-card)}
.rkc[aria-pressed="true"]{border-color:var(--crimson-fill);background:var(--crimson-soft)}
.rkc[aria-pressed="true"]:before{background:var(--crimson-fill);border-color:var(--crimson-fill);box-shadow:inset 0 0 0 3px var(--bg-card)}
.rkl{list-style:none;margin:6px 0 0;padding:0}
.rkl li{padding:8px 0;border-bottom:1px solid var(--border-card)}
.rkl li:last-child{border-bottom:0}
.rkl b{display:block;font-size:calc(20px * var(--fs));line-height:1.3;word-break:break-word}
.rkl span{display:block;color:var(--text-muted);font-size:calc(17px * var(--fs));line-height:1.35}
.mc .rkl li{border-bottom-color:#E5E7EB}.mc .rkl b{color:#B91C1C;font-size:calc(24px * var(--fs))}.mc .rkl span{color:#4B5563}
.idacts{display:grid;gap:8px;margin:0 0 12px}.idacts .btn{margin-top:0}
.pfbar .chips{margin-top:8px}
.brbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:calc(18px * var(--fs));background:var(--bg-subtle);border:1px solid var(--border-card);border-radius:8px;padding:10px 12px;margin-top:10px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
.ho .kick{gap:8px}
.hon{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:99px;background:var(--text-primary);color:var(--bg-canvas);font-family:var(--font-num);font-weight:800;font-size:calc(17px * var(--fs));flex:none}
.ho.crit .hon{background:var(--crimson-fill);color:#FFFFFF}
.tmr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border-card)}
.tmr:first-child{padding-top:0}.tmr:last-child{border-bottom:0;padding-bottom:0}
.tml{flex:1 1 170px;min-width:0}
.tml b{display:block;line-height:1.3}
.tmv{font-family:var(--font-num);font-size:calc(36px * var(--fs));font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.tmv.none{font-family:var(--font-sans);font-size:calc(17px * var(--fs));color:var(--text-muted);font-weight:600}
.tma{color:var(--crimson);font-weight:800;font-variant-numeric:tabular-nums;font-size:calc(17px * var(--fs))}
.tmb{display:flex;flex-direction:column;gap:6px;flex:1 1 130px;max-width:100%;min-width:0}
.tmb .btn{margin:0;min-height:50px}
.tmset{margin:0;font-size:calc(17px * var(--fs))}
.tmset input{min-height:44px;padding:6px 8px;margin-top:2px;min-width:0;max-width:100%;width:100%;font-size:calc(17px * var(--fs))}
.note.red{background:var(--crimson-soft);border-color:var(--crimson-border);border-left-color:var(--crimson-fill)}
.note.red .ic{color:var(--crimson)}
.hlc{font-size:calc(22px * var(--fs));font-weight:900;line-height:1.3;margin:12px 0 4px;display:flex;align-items:flex-start;gap:8px;color:var(--text-primary)}
.hlc .ic{color:var(--crimson);margin-top:4px}
.prv{overflow-x:auto;background:var(--bg-subtle);border:1px solid var(--border-card);border-radius:12px;padding:12px;-webkit-overflow-scrolling:touch}
/* 打印件：固定白底黑字 */
.wcard{display:flex;flex-wrap:wrap;gap:4mm;color:#111;font-family:var(--font-sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wface{width:85.6mm;height:54mm;border:0.3mm dashed #6B7280;border-radius:3mm;background:#fff;color:#111;padding:2.5mm 3mm;overflow:hidden;position:relative;font-size:7pt;line-height:1.28;box-sizing:border-box;flex:none}
.wface .wh{background:#B91C1C;color:#fff;font-weight:800;font-size:7.5pt;padding:1mm 3mm;margin:-2.5mm -3mm 1.5mm;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center;gap:2mm;min-height:5.5mm;box-sizing:border-box}
.wname{font-size:11pt;font-weight:900;line-height:1.2;min-height:4mm}
.wbt{background:#fff;color:#B91C1C;font-weight:900;font-size:10pt;line-height:1.1;padding:0 1.5mm;border-radius:1mm;font-family:var(--font-num);letter-spacing:0}
.wrk{font-weight:800;color:#B91C1C;margin-top:.6mm}
.wl{font-weight:700;color:#4B5563}
.wt{margin-top:.8mm;word-break:break-word;margin-right:0}
.wqr{position:absolute;right:3mm;bottom:5mm;width:19mm;height:19mm}
.wqr svg,.fqr svg{width:100%;height:100%;display:block}
.wqrc{position:absolute;right:23mm;bottom:5mm;width:30mm;font-size:6pt;color:#4B5563;text-align:right}
.wdate{position:absolute;left:3mm;bottom:1.2mm;font-size:5.5pt;color:#6B7280}
.fsheet{width:100%;max-width:186mm;background:#fff;color:#111;padding:6mm;font-size:11pt;line-height:1.4;border:0.3mm solid #D1D5DB;box-sizing:border-box;font-family:var(--font-sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:1mm solid #B91C1C;padding-bottom:2mm}
.fh b{font-size:14pt;color:#B91C1C}.fh span{font-size:9pt;color:#4B5563}
.fname{font-size:18pt;font-weight:900;margin-top:3mm}
.fbt{display:inline-block;border:0.6mm solid #B91C1C;color:#B91C1C;border-radius:1.5mm;padding:0 2mm;font-size:15pt}
.frk{margin-top:3mm;border:0.5mm solid #B91C1C;border-radius:2mm;padding:2mm 3mm;color:#7F1D1D}
.frk .fk{font-weight:800;color:#B91C1C}
.fr{display:grid;grid-template-columns:42mm 1fr;gap:3mm;border-bottom:0.2mm solid #D1D5DB;padding:2mm 0;break-inside:avoid}
.fk{font-weight:800;color:#374151;font-size:9.5pt;line-height:1.3}
.fv2{font-weight:700;white-space:pre-wrap;word-break:break-word}
.famb{display:flex;justify-content:space-between;align-items:center;gap:4mm;margin-top:3mm;background:#FEF2F2;border:0.4mm solid #FECACA;border-radius:2mm;padding:2mm 3mm}
.famb b{font-family:var(--font-num);font-size:24pt;color:#B91C1C}
.fqrw{display:flex;align-items:center;gap:3mm;margin-top:3mm;font-size:9pt;color:#4B5563}.fqr{width:22mm;height:22mm;flex:none}
.ffoot{margin-top:3mm;font-size:9pt;color:#4B5563}
.fstk{display:flex;align-items:center;gap:4mm;width:95mm;max-width:100%;margin-top:6mm;border:1mm solid #047857;border-radius:4mm;padding:4mm;background:#fff;color:#111;break-inside:avoid;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.fstk svg{width:16mm;height:16mm;flex:none}.fstk b{display:block;font-size:13pt;line-height:1.25}.fstk small{display:block;color:#4B5563;font-size:8pt;margin-top:1mm}
#printArea{display:none}
@page{size:A4;margin:12mm}
@media print{
  html.printing body>*:not(#printArea){display:none!important}
  html.printing #printArea{display:block!important}
  html.printing body{padding:0!important;margin:0!important;background:#fff!important}
  html.printing .wcard{margin-bottom:6mm}
  html.printing .wface,html.printing .fstk{break-inside:avoid}
  html.printing .fsheet{border:0;padding:0;max-width:none}
}

/* ==========================================================================
   v0.9.1 视觉层（只改外观，不改功能、不改医学文字）
   - 更轻的边框、更柔和的分层阴影、更大的圆角
   - 急救卡图标按类别着色（浅色底 + 深色图标），一眼分辨
   - 顶栏、底栏毛玻璃；呼叫栏渐变红
   - 规则不变：正文与按钮文字 ≥17px；文字对比度 ≥4.5:1；红色实心只用于"拨打"和最危急入口
   ========================================================================== */
:root{
  --bg-canvas:#F3F4F6; --bg-subtle:#F1F5F9; --border-card:#E2E8F0; --border-strong:#94A3B8;
  --hair:rgba(15,23,42,.08);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 2px 10px -2px rgba(15,23,42,.06);
  --shadow-md:0 2px 4px rgba(15,23,42,.04),0 12px 28px -8px rgba(15,23,42,.14);
  --shadow-red:0 1px 0 rgba(255,255,255,.18) inset,0 10px 24px -8px rgba(185,28,28,.55);
  --radius-lg:18px; --radius-md:12px;
  --red-grad:linear-gradient(180deg,#DC2626 0%,#B91C1C 100%);
  --glass:rgba(255,255,255,.94); --seg-bg:#E5E8EC;
  /* 类别色：图标色 / 浅底（图标对浅底对比度均 ≥4.5:1） */
  --h-rose:#BE123C; --h-rose-bg:#FFE4E6;
  --h-sky:#0369A1;  --h-sky-bg:#E0F2FE;
  --h-vio:#6D28D9;  --h-vio-bg:#EDE9FE;
  --h-red:#B91C1C;  --h-red-bg:#FEE2E2;
  --h-amb:#B45309;  --h-amb-bg:#FEF3C7;
  --h-org:#C2410C;  --h-org-bg:#FFEDD5;
  --h-teal:#0F766E; --h-teal-bg:#CCFBF1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-canvas:#0B0F17; --border-card:#253044; --hair:rgba(255,255,255,.08); --glass:rgba(17,24,39,.94); --seg-bg:#1E293B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 12px 28px -8px rgba(0,0,0,.7); --shadow-red:0 10px 24px -8px rgba(0,0,0,.7);
  --h-rose:#FDA4AF; --h-rose-bg:rgba(244,63,94,.18); --h-sky:#7DD3FC; --h-sky-bg:rgba(14,165,233,.18);
  --h-vio:#C4B5FD; --h-vio-bg:rgba(139,92,246,.2); --h-red:#FCA5A5; --h-red-bg:rgba(239,68,68,.18);
  --h-amb:#FCD34D; --h-amb-bg:rgba(245,158,11,.18); --h-org:#FDBA74; --h-org-bg:rgba(249,115,22,.18);
  --h-teal:#5EEAD4; --h-teal-bg:rgba(20,184,166,.18);
}}
:root[data-theme="dark"]{
  --bg-canvas:#0B0F17; --border-card:#253044; --hair:rgba(255,255,255,.08); --glass:rgba(17,24,39,.94); --seg-bg:#1E293B;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 12px 28px -8px rgba(0,0,0,.7); --shadow-red:0 10px 24px -8px rgba(0,0,0,.7);
  --h-rose:#FDA4AF; --h-rose-bg:rgba(244,63,94,.18); --h-sky:#7DD3FC; --h-sky-bg:rgba(14,165,233,.18);
  --h-vio:#C4B5FD; --h-vio-bg:rgba(139,92,246,.2); --h-red:#FCA5A5; --h-red-bg:rgba(239,68,68,.18);
  --h-amb:#FCD34D; --h-amb-bg:rgba(245,158,11,.18); --h-org:#FDBA74; --h-org-bg:rgba(249,115,22,.18);
  --h-teal:#5EEAD4; --h-teal-bg:rgba(20,184,166,.18);
}
body{letter-spacing:.1px}

/* 顶栏 / 底栏：毛玻璃 */
header.top,nav.bnav,.shead{background:var(--bg-card);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);box-shadow:none}
header.top{border-bottom:1px solid var(--hair)}
nav.bnav{border-top:1px solid var(--hair);box-shadow:none}
.logo{border-radius:9px;box-shadow:0 2px 6px -1px rgba(4,120,87,.45)}
.brand{font-weight:800;letter-spacing:.4px}
.ibtn{border-radius:12px;border-color:var(--hair)}
.tab{font-weight:600;gap:4px;border-radius:14px}
.tab[aria-current="page"]{background:var(--bg-subtle);color:var(--text-primary);font-weight:800}
.tab[aria-current="page"] .ic{stroke-width:2.4}

/* 呼叫栏：渐变红 + 白色电话键 */
.dock{background:linear-gradient(color-mix(in srgb,var(--bg-canvas) 0%,transparent),var(--bg-canvas) 14px)}
.call{background:var(--red-grad);border-radius:20px;padding:7px 7px 7px 18px;box-shadow:var(--shadow-red)}
.call:active{background:var(--crimson-press)}
.call .lbl{font-weight:700;opacity:.98}
.call .ico{border-radius:14px;box-shadow:0 2px 6px rgba(127,29,29,.35)}
.snav button{border-radius:18px}
.snav .pv{border:1px solid var(--border-strong);background:var(--bg-card)}
.snav .nx{box-shadow:var(--shadow-md)}

/* 卡片：更轻的边框 + 分层阴影 */
.card,.tile,.helpbtn,.steps li,.extra,.metro,.list,details.dd{border:1px solid var(--hair);box-shadow:var(--shadow-sm)}
.card{border-radius:20px;padding:18px}
.card.crit{border-left:1px solid var(--hair);position:relative;overflow:hidden}
.card.crit:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--red-grad)}
.secH{margin:30px 4px 12px;color:var(--text-muted)}
.secH b{font-weight:800;letter-spacing:.3px}
.kick{font-weight:700;letter-spacing:.4px}

/* 位置条 */
.lcard{padding:12px 10px 12px 12px}
.lflag{width:1.5em;height:1.5em;border-radius:50%;background:var(--seg-bg);display:grid;place-items:center;font-size:calc(28px * var(--fs))}
.lname{font-weight:800}
.badge{font-weight:600}

/* 两问分诊 */
.tri h1{font-weight:800;letter-spacing:.3px}
.big{border-radius:18px;font-weight:800}
.big.no{background:var(--red-grad);box-shadow:var(--shadow-red)}
.big.yes{background:var(--bg-card);border:1.5px solid var(--border-strong);box-shadow:var(--shadow-sm)}

/* 帮别人 / 通知家人：白卡 + 红色浅底图标（不再整圈红框） */
.helpbtn{border-radius:20px;padding:16px;gap:14px;margin:0 0 12px}
.helpbtn .sg{background:var(--h-red-bg);color:var(--h-red);border-radius:14px}
.helpbtn b{font-weight:800}
.helpbtn:active{transform:scale(.99);box-shadow:none}

/* 急救卡网格：类别色图标 */
.grid{gap:12px}
.tile{border-radius:20px;padding:16px 14px 14px;gap:14px;transition:transform .08s}
.tile b{font-weight:800;letter-spacing:.2px}
.tile .sg{width:46px;height:46px;border-radius:14px;background:var(--h-teal-bg);color:var(--h-teal)}
.tile .sg .ic{stroke-width:2.2}
[data-card="heart"] .sg,[data-card="icpr"] .sg{background:var(--h-rose-bg);color:var(--h-rose)}
[data-card="choke"] .sg,[data-card="ichoke"] .sg{background:var(--h-sky-bg);color:var(--h-sky)}
[data-card="stroke"] .sg,[data-card="seiz"] .sg,[data-card="unc"] .sg{background:var(--h-vio-bg);color:var(--h-vio)}
[data-card="bleed"] .sg{background:var(--h-red-bg);color:var(--h-red)}
[data-card="ana"] .sg{background:var(--h-amb-bg);color:var(--h-amb)}
[data-card="burn"] .sg,[data-card="heat"] .sg{background:var(--h-org-bg);color:var(--h-org)}
[data-card="poison"] .sg{background:var(--h-teal-bg);color:var(--h-teal)}
.tile.top{background:var(--red-grad);border-color:transparent;border-radius:22px;padding:18px 16px;box-shadow:var(--shadow-red)}
.tile.top .sg{background:#FFFFFF;color:#DC2626;border-radius:16px}
.pend{border-radius:8px;background:var(--amber-soft);border-color:var(--amber-border);color:var(--amber);padding:1px 8px;font-weight:700}

/* 号码、按钮、提示 */
.n{border:1px solid var(--hair);border-radius:14px;background:var(--bg-subtle)}
.btn{border-radius:14px;font-weight:700;letter-spacing:.3px}
.btn.red{background:var(--red-grad);box-shadow:var(--shadow-red)}
.btn.grn{background:linear-gradient(180deg,#059669 0%,#047857 100%)}
.btn:not(.ghost):not(.warn){box-shadow:var(--shadow-sm)}
.btn.red{box-shadow:var(--shadow-red)}
.note{border-radius:14px;border-left-width:4px}
.urlbox{border-radius:12px;border-color:var(--hair)}
details.ifo summary{font-weight:600}
input,textarea{border-radius:12px}
.chip2,.seg3 button,.seg2 button,.seg4 button,.bchoice,.rkc{border-radius:12px}
.chip2{border-radius:99px}

/* 全屏步骤页 */
.shead{border-bottom:1px solid var(--hair)}
.back,.chip{border-radius:12px;border-color:var(--hair);background:var(--bg-card);box-shadow:var(--shadow-sm)}
.seg{border-radius:14px;border-color:transparent;background:var(--seg-bg)}
.seg span{border-radius:10px}
.seg span.on{border-color:transparent;box-shadow:var(--shadow-sm)}
.ttl .sg{border-radius:16px;box-shadow:0 4px 12px -4px rgba(4,120,87,.5)}
.ttl .sg.red{background:var(--red-grad);box-shadow:var(--shadow-red)}
.sheet h1{font-weight:800}
.when{border-radius:14px;font-weight:600}
.prog{gap:5px}
.prog i{height:5px;border-radius:99px}
.prog i.d{background:var(--red-grad)}
.stepTxt{font-weight:700;letter-spacing:.3px}
details.dd{border-radius:16px;border-left:4px solid var(--crimson-fill)}
.steps li{border-radius:16px;font-weight:500}
.steps li:before{background:var(--red-grad)}
.dont{border-radius:16px;border-left-width:4px}
.extra,.metro{border-radius:16px}
.fig{border-radius:16px;border-color:var(--hair)}

/* 首次确认国家 */
.cf .flag{box-shadow:var(--shadow-md);border-color:var(--hair)}
.cf .cn{font-weight:800}
.rblock{background:var(--red-grad);border-radius:20px}
.rblock.empty{background:var(--bg-subtle)}

/* 分享二维码（v0.9.1） */
.qrw{margin:14px auto 2px;text-align:center}
.qrw img{display:block;width:100%;max-width:260px;height:auto;margin:0 auto;border-radius:16px;border:1px solid var(--hair);box-shadow:var(--shadow-md);background:#FFFFFF;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.qrw figcaption{margin-top:10px;color:var(--text-secondary);font-weight:600;font-size:calc(17px * var(--fs));line-height:1.45}
@media print{.qrw{display:none}}

/* ===================== v0.10.0：Pro 设计移植 ===================== */
/* ① 国家未确认：呼叫栏旁“未确认”，位置卡内就地确认 */
.callrow{display:flex;gap:8px;align-items:stretch}
.callrow .call{flex:1 1 auto;min-width:0}
.ucf{flex:none;min-width:76px;max-width:34%;padding:4px 8px;border-radius:var(--radius-lg);background:var(--amber-soft);border:2px solid var(--amber-bar);color:var(--amber);
  font-weight:800;font-size:calc(17px * var(--fs));line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;box-shadow:var(--shadow-sm)}
.ucf .ic{width:20px;height:20px}
body:not(.sheet-on) .dock .ucf{background:var(--bg-card)}
.lcard.unconf{border:2px solid var(--amber-bar)}
.ucfrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;padding:10px 12px;border-radius:var(--radius-md);background:var(--amber-soft);color:var(--amber);font-weight:700;line-height:1.35}
.ucfrow>span{flex:1 1 12em;min-width:0}
.ucfrow .btn{margin:0;min-height:48px;width:auto;flex:none;padding:0 16px}
/* ② 首页三按钮横排 */
.qa3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;min-height:104px;padding:14px 6px 12px;background:var(--bg-card);
  border:1px solid var(--border-card);border-radius:18px;text-align:center;box-shadow:var(--shadow-sm)}
.qa:active{transform:scale(.98);box-shadow:none}
.qa .sg{width:44px;height:44px;border-radius:14px;background:var(--h-red-bg);color:var(--h-red)}
.qa b{font-size:calc(17px * var(--fs));line-height:1.25;font-weight:800;overflow-wrap:anywhere}
html.hugetext .qa3{grid-template-columns:1fr}
html.hugetext .qa{flex-direction:row;min-height:64px;padding:10px 14px;text-align:left}
/* ③ 分类标签 */
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.cat{flex:none;min-height:44px;padding:0 14px;border-radius:99px;background:var(--bg-card);border:1px solid var(--border-card);font-weight:700;font-size:calc(17px * var(--fs));white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--text-primary);color:var(--bg-canvas);border-color:var(--text-primary)}

.stepcard svg:not(.ic){max-width:100%;height:auto}
.ctime{display:block;margin-top:2px;font-weight:700;color:var(--text-muted)}
.ctime b{font-family:var(--font-num);font-variant-numeric:tabular-nums;color:var(--text-primary);font-size:calc(22px * var(--fs));letter-spacing:.5px}
.swh{margin-left:auto;color:var(--text-muted);font-weight:600;font-size:calc(17px * var(--fs));white-space:nowrap}

@keyframes swL{from{opacity:.2;transform:translateX(-28px)}to{opacity:1;transform:none}}

.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg3 button,.seg2 button,.seg4 button{min-width:0;flex-wrap:wrap;text-align:center;overflow-wrap:anywhere;line-height:1.2;padding:4px 6px}

.btn:not(.red):not(.grn):not(.ghost):not(.warn):active{background:var(--brand-press)}

.cat[aria-pressed="true"]:not([data-cat="life"]),.chip2[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#FFFFFF}

.prog i.d{background:var(--brand)}
.stepcard .sn{background:var(--brand)}

.card.crit{background:var(--crimson-soft)}

.tile:not(.top),.qa{background:linear-gradient(180deg,var(--tile-a) 0%,var(--tile-b) 100%);border-color:transparent;color:#FFFFFF;

.tile:not(.top) .chev,.qa .chev{color:#FFFFFF}

.tile:not(.top),.qa{

 dont:[["不要反复掀开看伤口。","Do not keep lifting the dressing to look."]],src:[145,19,22]},
{id:"ana",i:"⚠️",zh:"严重过敏反应",en:"Anaphylaxis",szh:"喉咙肿、喘不上气、晕厥",sen:"Throat swelling, wheeze, collapse",
 when:["进食、用药或蜂蜇后突然出现：嘴唇/舌头/喉咙肿胀、呼吸困难或喘鸣、头晕或晕倒。","Sudden swelling of lips, tongue or throat, difficulty breathing or wheeze, dizziness or collapse — after food, medicine or a sting."],
 steps:[["患者带有肾上腺素自动注射笔：立刻在大腿外侧中部注射（可隔着衣物，按笔身说明操作）。","If they have an adrenaline (epinephrine) auto-injector: use it at once in the outer mid-thigh (through clothing if needed; follow the label)."],
  ["拨打 {N}，明确说“过敏性休克 / anaphylaxis”。","Call {N} and say “anaphylaxis”."],
  ["让患者平躺并抬高双腿。呼吸困难时可稍微坐起；孕妇取左侧卧。","Lie them flat with legs raised. If struggling to breathe, sit them up slightly; if pregnant, lie on the left side."],
  ["5 分钟后没有好转：使用第二支注射笔。","No improvement after 5 minutes: use a second auto-injector."],
  ["即使好转也必须去医院观察。失去反应且无正常呼吸：心肺复苏。","They must go to hospital even if they improve. If unresponsive and not breathing normally: CPR."]],
 dont:[["不要让患者站起来或走动。","Do not let them stand up or walk."]],src:[23]},
{id:"seiz",i:"⚡",zh:"抽搐 · 癫痫发作",en:"Seizure",szh:"倒地、四肢抽动",sen:"Collapse with jerking",
 when:["突然倒地、身体僵直或抽动、意识丧失。","Sudden collapse, stiffening or jerking, loss of awareness."],
 steps:[["移开周围硬物、尖锐物，用柔软衣物垫住头部。","Clear hard or sharp objects away; cushion the head."],
  ["记下开始时间。","Note the time it started."],
  ["抽搐停止后：让其侧卧（复原体位），陪伴直到完全清醒。","When jerking stops: roll them onto their side (recovery position) and stay until fully awake."],
  ["出现以下任一情况拨打 {N}：超过 5 分钟、反复发作、第一次发作、受伤、怀孕、在水中发作、之后不清醒。","Call {N} if: it lasts over 5 minutes, repeats, is a first seizure, they are injured, pregnant, it happened in water, or they do not wake afterwards."]],
 dont:[["不要按压、束缚肢体。","Do not hold them down."],["不要往嘴里塞任何东西。","Do not put anything in their mouth."]],src:[148,99]},
{id:"burn",i:"🔥",zh:"烧伤 · 烫伤",en:"Burns & scalds",szh:"流动冷水冲 20 分钟",sen:"Cool running water, 20 minutes",
 when:["任何热力、热液烧烫伤。","Any burn from heat or hot liquid."],
 steps:[["先让人离开热源、扑灭火焰，确保自己安全。","Stop the burning: move away from the heat, put out flames; keep yourself safe."],
  ["立即用流动的凉水冲 20 分钟（受伤 3 小时内冲洗仍有益）。","Cool with cool running water for 20 minutes (still helpful up to 3 hours after)."],
  ["取下伤处附近的衣物和首饰——粘在皮肤上的不要撕。","Remove nearby clothing and jewellery — but not anything stuck to the skin."],
  ["用保鲜膜或干净不粘的敷料松松覆盖。","Cover loosely with cling film or a clean non-stick dressing."],
  ["给伤者保暖，防止失温（尤其儿童和老人）。","Keep the person warm, especially children and older people."],
  ["面积大、较深、在面部/手/关节/会阴，化学或电烧伤，儿童或老人：拨打 {N} 或立即就医。","Large or deep burns, burns to face, hands, joints or genitals, chemical or electrical burns, children or older people: call {N} or get urgent care."]],
 dont:[["不要用冰、冰水。","No ice or iced water."],["不要涂牙膏、黄油、酱油或任何药膏。","No toothpaste, butter, or creams."]],src:[25]},
{id:"heat",i:"🌡️",zh:"中暑 · 热射病",en:"Heat exhaustion & heatstroke",szh:"高热、意识模糊是急症",sen:"Very hot and confused is an emergency",
 when:["热衰竭：乏力、头晕、头痛、恶心、大量出汗。热射病（急症）：体温极高、皮肤发烫不出汗、呼吸心跳加快、意识模糊、抽搐或昏迷。",
       "Heat exhaustion: tiredness, dizziness, headache, nausea, heavy sweating. Heatstroke (emergency): very high temperature, hot skin not sweating, fast breathing or heartbeat, confusion, seizure or loss of consciousness."],
 steps:[["转移到阴凉处，脱去多余衣物。","Move them to a cool place; remove unnecessary clothing."],
  ["清醒时让其喝凉水或补液饮料。","If awake, give cool water or a rehydration drink."],
  ["给皮肤降温：喷洒或擦拭凉水并扇风，腋下、颈部放包布的冰袋。","Cool the skin: spray or sponge with cool water and fan; wrapped cold packs at armpits and neck."],
  ["守在旁边。30 分钟内应明显好转。","Stay with them. They should improve within 30 minutes."],
  ["30 分钟后仍不适，或出现任何热射病表现：拨打 {N}，等待时用凉湿床单包裹并持续降温。","Still unwell after 30 minutes, or any heatstroke sign: call {N}; while waiting wrap in a cool wet sheet and keep cooling."],
  ["失去意识但有呼吸：侧卧（复原体位）。","If they lose consciousness but are breathing: recovery position."]],
 dont:[["不要给意识不清的人喂水。","Do not give drinks to someone who is not fully awake."]],src:[26]},
{id:"poison",i:"☠️",zh:"中毒 · 药物过量",en:"Poisoning & overdose",szh:"不要催吐",sen:"Do not make them vomit",
 when:["误服或过量服用药物、化学品，吸入有毒气体。","Swallowed medicines or chemicals, overdose, or breathed in toxic fumes."],
 steps:[["先确保自己安全。有毒气体环境：尽快把人带到空气新鲜处。","Keep yourself safe. Toxic fumes: get the person into fresh air if you safely can."],
  ["拨打 {N}：说明吃了什么、多少、什么时候。","Call {N}: say what was taken, how much and when."],
  ["保留药瓶、包装或呕吐物，交给医护人员。","Keep the packaging, container or any vomit for the medical team."],
  ["皮肤沾染：脱掉被污染的衣物，用水充分冲洗。","On skin: remove contaminated clothing and rinse thoroughly with water."],
  ["昏迷但有呼吸：侧卧（复原体位），持续观察呼吸。","Unconscious but breathing: recovery position; keep checking breathing."],
  ["没有呼吸：心肺复苏。怀疑阿片类过量且有纳洛酮：立即使用。","Not breathing: CPR. Suspected opioid overdose and naloxone available: use it now."]],
 dont:[["不要催吐。","Do not try to make them vomit."],["不要给任何吃的喝的。","Give nothing to eat or drink."],["不要把手伸进其口中。","Do not put your hand in their mouth."]],src:[27]},
{id:"unc",i:"🛌",zh:"昏迷但有呼吸",en:"Unconscious but breathing",szh:"侧卧，保持气道通畅",sen:"On their side, airway open",
 when:["叫不醒，但呼吸正常。","Does not wake, but is breathing normally."],
 steps:[["拨打 {N}。","Call {N}."],
  ["让其侧卧：上方的腿向前屈起支撑，背后可垫东西，防止翻回仰卧或趴下。","Roll them onto their side: upper leg bent forward for support, something behind the back so they do not roll."],
  ["头略后仰，保持气道通畅；有呕吐物让其自然流出并擦去。","Tilt the head back slightly to keep the airway open; let any vomit drain and wipe it away."],
  ["守在旁边，持续观察呼吸。","Stay and keep checking their breathing."],
  ["呼吸停止或不正常：立刻平躺，开始心肺复苏。","If breathing stops or becomes abnormal: roll onto the back and start CPR."]],
 dont:[["不要喂水喂药。","Give nothing by mouth."],["不要独自留下患者。","Do not leave them alone."]],src:[27]}
];

var DET=detect(),manual=null,confirmed=false;
(function(){var q=/[?&]c=([A-Za-z]{2})/.exec(location.search);
  if(q&&C[q[1].toUpperCase()]){manual=q[1].toUpperCase();confirmed=true;return}
  try{var g=JSON.parse(load("ec_geo")||"null");
    if(g&&g.det===DET&&C[g.c]){confirmed=true;manual=(g.c!==DET)?g.c:null}}catch(e){}})();
function cc(){return manual||DET}
function saveGeo(){confirmed=true;store("ec_geo",JSON.stringify({det:DET,c:cc()}))}

/* ===================== v0.4.1：文字大小 =====================
   iPhone 的 Safari 默认不跟随系统“文字大小”。这里读取 -apple-system-body 的字号（会随系统设置变化，标准为 17px），
   按比例放大全部文字（--fs）；安卓或其他浏览器读不到时按“标准”。也可以手动选 大 / 特大。 */
var fsMode=(function(){var m=load("ec_fs");return m==="m"||m==="l"||m==="xl"?m:"sys"})();
function sysScale(){try{if(!(window.CSS&&CSS.supports&&CSS.supports("font","-apple-system-body")))return 1;
  var p=document.createElement("span");p.style.cssText="position:absolute;visibility:hidden;font:-apple-system-body";p.textContent="x";
  document.body.appendChild(p);var px=parseFloat(getComputedStyle(p).fontSize)||17;p.remove();
  if(!isIOS())return 1;return px/17}catch(e){return 1}}
function applyFs(){var k=fsMode==="l"?1.15:fsMode==="xl"?1.3:fsMode==="m"?1:sysScale();
  k=Math.max(1,Math.min(1.45,k));k=Math.round(k*100)/100;

/* ===================== v0.4.3：实测真实字号 + 实测顶栏/底栏高度 =====================
   中文字（如“国”）的宽度恒等于 1 个字号。隐藏的“国”字按 100px × --fs 排版，
   量出来的宽度 ÷ 100 = 真实放大倍数（包含本页“大/特大”和安卓系统/微信的放大）。 */
var TZOOM=1;
function probeEl(){var p=document.getElementById("ecProbe");
  if(!p){p=document.createElement("span");p.id="ecProbe";p.setAttribute("aria-hidden","true");p.textContent="\u56fd";document.body.appendChild(p)}return p}
function fitText(){try{var w=probeEl().getBoundingClientRect().width/100;
    if(!(w>=0.8&&w<=4))w=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||1;
    TZOOM=Math.round(w*100)/100;var r=document.documentElement;
    r.classList.toggle("bigtext",TZOOM>=1.12);r.classList.toggle("hugetext",TZOOM>=1.4);r.classList.toggle("maxtext",TZOOM>=1.7)}catch(e){}
  fitChrome()}
function fitChrome(){try{var r=document.documentElement.style,h=document.querySelector("header.top"),n=$("nav"),d=$("dock");
  if(h)r.setProperty("--top-real",h.offsetHeight+"px");

  if(d)r.setProperty("--dock-real",d.offsetHeight+"px")}catch(e){}}
(function(){var q=null;function later(){if(q)return;q=(window.requestAnimationFrame||setTimeout)(function(){q=null;fitText()})}
  try{if(window.ResizeObserver){var ro=new ResizeObserver(later);ro.observe(probeEl());
    ["nav","dock"].forEach(function(id){var e=$(id);if(e)ro.observe(e)});var h=document.querySelector("header.top");if(h)ro.observe(h)}}catch(e){}

/* WGS-84 → GCJ-02（公开的标准换算公式；只在中国大陆境内使用） */

/* ---------- 家人代管：多份档案（localStorage "ec_prof"；旧版单份 "ec_id" 在第一次保存时自动并入第 1 份） ---------- */
var PF_MAX=6;
function profs(){var p=null;try{p=JSON.parse(load("ec_prof")||"null")}catch(e){}
  if(!p||!p.list||!p.list.length){var d={};try{d=JSON.parse(load("ec_id")||"{}")||{}}catch(e){}p={cur:0,list:[{n:"",d:d}]}}
  if(!(p.cur>=0&&p.cur<p.list.length))p.cur=0;return p}
function saveProfs(p){store("ec_prof",JSON.stringify(p));store("ec_id",null)}
function getId(){var p=profs();return p.list[p.cur].d||{}}
function setId(d){var p=profs();p.list[p.cur].d=d;saveProfs(p)}
function pfLabel(p,i){var x=p.list[i];return x.n||(i===0?t("pfMe"):t("pfFam").replace("{n}",i+1))}
function pfBar(P){
  return '<section class="card pfbar"><div class="kick">'+I("users","s")+t("pfK")+'</div><div class="chips" role="group" aria-label="'+esc(t("pfK"))+'">'+
    P.list.map(function(x,i){return '<button class="chip2" data-pf="'+i+'" aria-pressed="'+(i===P.cur)+'">'+esc(pfLabel(P,i))+'</button>'}).join("")+
    (P.list.length<PF_MAX?'<button class="chip2" id="pfAdd">+ '+t("pfAdd")+'</button>':'')+'</div>'+info(t("pfHint"))+'</section>'}

/* ---------- 高危勾选项 ----------
   顺序 p 按美国急诊医师学会（ACEP，经 MedicAlert 转述，来源 101）：1 严重过敏 → 2 药物 → 3 疾病 → 4 体内器械。
   en / zh 为界面文字（不是医学步骤）。loc = 当地语言词，只收有来源的：取自日本厚生劳动省内科问诊票（ja/ko 来源 72，es 74，vi 76，id 78），
   多数从问句中截取名词；全部待母语者核对。没有来源的语言不显示当地语言（不自己翻译）。tag = 手环刻字建议用的英文大写。 */
var RISK=[
 {k:"ana",p:1,zh:"严重过敏（曾发生过敏性休克）",en:"Severe allergy (anaphylaxis)",tag:"SEVERE ALLERGY - ANAPHYLAXIS"},
 {k:"drug",p:1,zh:"药物过敏（药名写在“过敏”栏）",en:"Drug allergy (see Allergies)",tag:"DRUG ALLERGY"},
 {k:"latex",p:1,zh:"乳胶过敏",en:"Latex allergy",tag:"LATEX ALLERGY"},
 {k:"anticoag",p:2,zh:"正在用抗凝药 / 抗血栓药（出血风险）",en:"Takes blood thinners (bleeding risk)",tag:"ON BLOOD THINNERS"},
 {k:"insulin",p:2,zh:"使用胰岛素",en:"Uses insulin",tag:"INSULIN DEPENDENT"},
 {k:"steroid",p:2,zh:"依赖激素（类固醇）治疗",en:"Steroid dependent",tag:"STEROID DEPENDENT"},
 {k:"dm",p:3,zh:"糖尿病",en:"Diabetes",tag:"DIABETES",loc:{ja:"糖尿病",ko:"당뇨병",es:"Diabetes",vi:"Đái tháo đường",id:"Diabetes mellitus"}},
 {k:"epi",p:3,zh:"癫痫",en:"Epilepsy",tag:"EPILEPSY",loc:{ja:"てんかん",ko:"전간",es:"Epilepsia",vi:"Động kinh",id:"Epilepsi"}},
 {k:"preg",p:3,zh:"怀孕",en:"Pregnant",loc:{ja:"妊娠",ko:"임신",es:"Embarazada",vi:"Mang thai",id:"Hamil"}},
 {k:"g6pd",p:3,zh:"G6PD 缺乏症（蚕豆病）",en:"G6PD deficiency",tag:"G6PD DEFICIENCY"},
 {k:"pm",p:4,zh:"心脏起搏器 / 植入式除颤器（ICD）",en:"Pacemaker / ICD (implanted)",tag:"PACEMAKER / ICD"}
];
var RK_SRC={ja:[72],ko:[72],es:[74],vi:[76],id:[78]};
/* 建议戴手环的情况：严重过敏（ACEP 列第一）、糖尿病 / 癫痫 / 心脏器械（MedlinePlus），以及需要马上知道的用药 */
var BR_KEYS={ana:1,drug:1,latex:1,anticoag:1,insulin:1,steroid:1,dm:1,epi:1,pm:1};
function riskOf(d){var r=(d&&d.risk)||[];return RISK.filter(function(x){return r.indexOf(x.k)>=0})}
function rkHas(rk,k){return rk.some(function(x){return x.k===k})}
function rkLoc(x,lk){return (x.loc&&RK_SRC[lk]&&x.loc[lk])||""}
/* 一项：当地语言（有来源时）大字，下面 English · 中文；中文界面的国家用中文大字 */
function rkLi(x,lk,d){var lo=rkLoc(x,lk),zh=lk==="zht"||lk==="zhs"||(!lo&&lang==="zh"&&!lk);
  var ex=(x.k==="preg"&&d&&dueOk(d.due))?' · Due '+T.dueK[0]+' '+d.due:'';
  if(lo)return '<li><b lang="'+lk+'">'+esc(lo)+'</b><span>'+esc(x.en)+' · '+esc(x.zh)+esc(ex)+'</span></li>';
  if(zh)return '<li><b>'+esc(x.zh)+'</b><span>'+esc(x.en)+esc(ex)+'</span></li>';
  return '<li><b>'+esc(x.en)+'</b><span>'+esc(x.zh)+esc(ex)+'</span></li>'}
function rkNotes(rk){var n=[];if(rkHas(rk,"pm"))n.push(t("rkPm")+' '+srcLine([111]));if(rkHas(rk,"steroid"))n.push(t("rkSt")+' '+srcLine([112]));
  return n.map(function(s){return '<div class="mcs">'+s+'</div>'}).join("")}

/* ---------- 手环刻字建议 ---------- */
function brLines(d){var rk=riskOf(d),L2=[];
  rk.forEach(function(x){if(x.tag)L2.push(x.tag)});
  if(d.allergy&&/^[\x20-\x7E]+$/.test(d.allergy))L2.splice(rkHas(rk,"ana")||rkHas(rk,"drug")||rkHas(rk,"latex")?1:0,0,"ALLERGY: "+d.allergy.toUpperCase());
  var ph=phoneIn(d.ice);if(ph)L2.push("ICE "+ph);
  return L2}
function brHtml(d){var rk=riskOf(d);if(!rk.some(function(x){return BR_KEYS[x.k]}))return "";
  var lines=brLines(d),txt=lines.join("\n");
  return '<section class="card"><div class="kick">'+I("idc","s")+t("brT")+'</div><p style="margin:6px 0 0">'+t("brS")+'</p>'+
    '<div class="brbox">'+esc(txt)+'</div>'+info('<p>'+t("brOrder")+'</p><p>'+t("brNote")+'</p>')+
    '<button class="btn ghost" id="brCopy" data-v="'+esc(txt)+'">'+t("brCopy")+'</button>'+
    '<div class="src">'+srcFold([101,102,103])+'</div></section>'}

/* ---------- 发病时间记录（localStorage "ec_tm"，只存本机） ---------- */
var TM=[["onset","tmOn"],["well","tmWell"],["seizS","tmSz"],["seizE","tmSe"],["cpr","tmCpr"],["call","tmCall"]];
function tmLoad(){try{return JSON.parse(load("ec_tm")||"{}")||{}}catch(e){return {}}}
function tmSave(o){store("ec_tm",Object.keys(o).length?JSON.stringify(o):null)}
function p2(n){return ("0"+n).slice(-2)}
function hmOf(ts){var d=new Date(ts);return p2(d.getHours())+":"+p2(d.getMinutes())}
function dur(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  if(lang==="zh")return h?h+" 小时 "+m+" 分":m+" 分 "+p2(x)+" 秒";return h?h+" h "+m+" min":m+" min "+p2(x)+" s"}
var tmInt=null;
function seizOver(o){var s=o.seizS;return !!s&&!(o.seizE&&o.seizE>=s)&&Date.now()-s>=300000}
function tmTick(){if(!$("tmWarn")){if(tmInt){clearInterval(tmInt);tmInt=null}return}
  var o=tmLoad(),now=Date.now();
  TM.forEach(function(x){var e=$("tm_"+x[0]);if(e)e.textContent=o[x[0]]?t("tmAgo").replace("{t}",dur(now-o[x[0]])):""});
  $("tmWarn").hidden=!seizOver(o)}

    '<section class="card" style="margin-top:12px">'+TM.map(function(x){var k=x[0],v=o[k];
      return '<div class="tmr"><div class="tml"><b>'+t(x[1])+'</b><div class="tmv'+(v?'':' none')+'">'+(v?hmOf(v):t("tmNone"))+'</div><div class="tma" id="tm_'+k+'" aria-live="off"></div></div>'+
