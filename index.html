<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B42318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急救卡">
<meta name="description" content="急救卡 Emergency Card — 按所在国家自动切换急救电话与急救步骤（中文 / English）">
<title>急救卡 Emergency Card</title>
<style>
:root{
  --bg:#F6F5F2; --card:#FFFFFF; --ink:#16181D; --sub:#555B67; --line:#E4E2DC;
  --red:#C8281C; --red-d:#9E1B12; --red-soft:#FDECEA; --ok:#0B7A53; --ok-soft:#E6F4EE;
  --warn:#7A4F00; --warn-soft:#FFF4D6; --blue:#1F4FD8; --r:18px;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 8px 24px rgba(20,20,20,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1114; --card:#1A1D22; --ink:#F3F4F6; --sub:#A9AFBA; --line:#2B3038;
  --red:#F0483B; --red-d:#D63A2E; --red-soft:#3A1614; --ok:#4AD19B; --ok-soft:#10301F;
  --warn:#F5C451; --warn-soft:#33290C; --blue:#8FB0FF; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(124px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
h1:focus{outline:none}

header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:10px;height:56px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center;flex:none}
.logo:before{content:"";width:16px;height:16px;background:
  linear-gradient(#fff,#fff) center/100% 5px no-repeat,linear-gradient(#fff,#fff) center/5px 100% no-repeat}
.brand{font-weight:700;letter-spacing:.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:17px;white-space:nowrap;flex:none}
.beta{font-size:17px;line-height:1.45;color:var(--warn);background:var(--warn-soft);border-radius:14px;padding:12px 14px;margin:14px 0 0}

/* 所在国家 */
.where{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.where b{font-size:19px}
.where small{display:block;color:var(--sub);font-size:17px;line-height:1.3}
.lvl{font-size:17px;font-weight:700;border-radius:8px;padding:1px 8px;margin-left:8px;white-space:nowrap}
.lvl.A{background:var(--ok-soft);color:var(--ok)} .lvl.B{background:var(--warn-soft);color:var(--warn)} .lvl.C{background:var(--red-soft);color:var(--red)}

/* 两问分诊 */
.tri{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.tri-k{font-size:17px;font-weight:700;color:var(--red)}
.tri h1{font-size:30px;line-height:1.2;margin:4px 0 6px}
.tri p{margin:0 0 14px;color:var(--sub)}
.tri-b{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{min-height:92px;border-radius:18px;padding:12px;font-size:22px;font-weight:800;line-height:1.2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.big small{font-size:17px;font-weight:600;opacity:.92}
.big.no{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(200,40,28,.28)}
.big.no:active{background:var(--red-d)}
.big.yes{background:var(--bg);border:2px solid var(--ink)}
.big:active{transform:scale(.98)}
.link{color:var(--blue);font-weight:600;min-height:48px;padding:0 4px;text-decoration:underline}

/* 呼叫按钮 */
.call{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;
  background:var(--red);color:#fff;border-radius:20px;padding:10px 20px;min-height:76px;
  box-shadow:0 10px 24px rgba(200,40,28,.32)}
.call:active{background:var(--red-d);transform:scale(.99)}
.call .lbl{font-size:17px;font-weight:600;line-height:1.25;display:block}
.call .num{font-size:38px;font-weight:800;letter-spacing:1px;line-height:1.05;font-variant-numeric:tabular-nums;display:block}
.call .ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:21;padding:14px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 14px)}
.dock>*{max-width:528px;margin-left:auto;margin-right:auto}
.snav{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-bottom:10px}
.snav button{min-height:60px;border-radius:16px;font-size:20px;font-weight:800}
.snav .pv{background:var(--card);border:1.5px solid var(--line)}
.snav .pv:disabled{opacity:.4}
.snav .nx{background:var(--ink);color:var(--bg)}

.hero{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.n{display:flex;justify-content:space-between;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;background:var(--bg)}
.n span{font-size:17px;color:var(--sub);line-height:1.25}
.n b{font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.notes{margin:12px 0 0;padding:0;list-style:none;font-size:17px;color:var(--sub)}
.notes li{padding-left:16px;position:relative;margin-top:6px}
.notes li:before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--red)}

h2{font-size:17px;letter-spacing:.04em;color:var(--sub);margin:28px 4px 10px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.say{margin:0;padding:0;list-style:none;counter-reset:s}
.say li{counter-increment:s;display:flex;gap:10px;padding:7px 0;font-size:17px}
.say li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--red-soft);color:var(--red);
  font-weight:700;font-size:17px;display:grid;place-items:center;margin-top:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:14px;
  background:var(--ink);color:var(--bg);font-weight:700;width:100%;margin-top:10px;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.loc{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0 2px;word-break:break-all}
.muted{color:var(--sub);font-size:17px}
.tip{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.tip b{display:block;margin-bottom:4px}
.tip p{margin:6px 0 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;min-height:120px;
  display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile i{font-style:normal;font-size:28px;line-height:1}
.tile b{font-size:18px;line-height:1.25;display:block;margin-top:10px}
.tile small{color:var(--sub);font-size:17px;line-height:1.3;display:block;margin-top:2px}
.tile.top{grid-column:1/-1;background:var(--red-soft);border-color:transparent;flex-direction:row;justify-content:flex-start;align-items:center;min-height:84px;gap:14px}
.tile.top b{margin:0;font-size:19px}

/* 全屏层：卡片 / 选国家 / 确认国家 */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;display:none;
  padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.sheet.on{display:block}
.shead{position:sticky;top:0;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px;z-index:2;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.shead .sp{flex:1}
.back,.chip{min-height:48px;padding:0 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:17px;white-space:nowrap}
.back{padding-left:10px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet h1{font-size:26px;line-height:1.2;margin:16px 0 8px}
.when{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 12px;font-size:17px;font-weight:600}
.status{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--sub);font-size:17px;margin-top:8px}

/* 执行模式：一屏一步 */
.prog{display:flex;gap:5px;margin:14px 0 10px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.d{background:var(--red)}
.stepK{font-size:17px;font-weight:800;color:var(--red);letter-spacing:.02em}
.stepTxt{font-size:27px;line-height:1.38;font-weight:700;margin:6px 0 0}
.stepTxt b{color:var(--red);font-size:1.15em;font-variant-numeric:tabular-nums}
.fig{display:block;width:100%;max-width:340px;height:auto;margin:10px auto 2px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.fig{background:#F5F2EC;border-color:transparent}
details.dd{margin-top:16px;background:var(--red-soft);border-radius:16px}
details.dd summary{min-height:52px;padding:12px 14px;font-weight:800;color:var(--red);cursor:pointer}
details.dd ul{margin:0;padding:0 14px 14px 34px}

.steps{list-style:none;margin:16px 0 0;padding:0;counter-reset:st}
.steps li{counter-increment:st;display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:8px;font-size:18px;line-height:1.45;font-weight:500}
.steps li:before{content:counter(st);flex:none;width:36px;height:36px;border-radius:12px;background:var(--red);color:#fff;
  font-weight:800;font-size:19px;display:grid;place-items:center}
.steps li>span{flex:1;min-width:0}
.dont{background:var(--red-soft);border-radius:16px;padding:14px;margin-top:12px}
.dont b{color:var(--red);display:block;margin-bottom:4px}
.dont ul{margin:0;padding-left:20px}
.extra{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;font-size:17px}
.src{font-size:17px;color:var(--sub);margin-top:14px;word-break:break-word}

.metro{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.metro .ml{flex:1;font-weight:700;line-height:1.25}
.dot{width:44px;height:44px;border-radius:50%;background:var(--red);flex:none;opacity:.25}
.dot.beat{animation:beat .12s ease-out}
@keyframes beat{from{opacity:1;transform:scale(1.25)}to{opacity:.25;transform:scale(1)}}

/* 确认国家 */
.cf{text-align:center;padding-top:8px}
.cf .flag{font-size:64px;line-height:1.1;margin-top:18px}
.cf .cn{font-size:30px;font-weight:800;line-height:1.2;margin:6px 0}
.cf .an{font-size:20px;font-weight:700}
.cf .an b{color:var(--red);font-size:30px;font-variant-numeric:tabular-nums}
.cf .btn{min-height:64px;font-size:20px}

.list{margin-top:8px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:56px;padding:12px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:18px;gap:10px}
.opt b{font-variant-numeric:tabular-nums;color:var(--red)}
label{display:block;font-size:17px;color:var(--sub);margin-top:10px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px;min-height:48px}
.idv{font-size:17px}.idv div{padding:6px 0;border-bottom:1px dashed var(--line)}.idv span{color:var(--sub);font-size:17px;display:block}
details.sl summary{min-height:48px;font-weight:700;cursor:pointer;display:flex;align-items:center}
.srcs{font-size:17px;color:var(--sub);padding-left:26px;margin:8px 0 0}
.srcs li{margin-top:6px;word-break:break-word}
footer{font-size:17px;color:var(--sub);margin:22px 4px 0}
@media (max-width:350px){.tri h1{font-size:26px}.big{font-size:20px}.stepTxt{font-size:24px}.call .num{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,.dock,.btn,.pill,.shead,#fb{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap bar">
  <div class="logo" aria-hidden="true"></div>
  <div class="brand" id="brand"></div>
  <button class="pill" id="langBtn" aria-label="Switch language / 切换语言"></button>
</div></header>

<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT"><div class="wrap" id="sheetBody"></div></div>
<div class="dock" id="dock"></div>

  if(q&&C[q[1].toUpperCase()]){manual=q[1].toUpperCase();confirmed=true;return}
  try{var g=JSON.parse(load("ec_geo")||"null");
    if(g&&g.det===DET&&C[g.c]){confirmed=true;manual=(g.c!==DET)?g.c:null}}catch(e){}})();
function cc(){return manual||DET}
function saveGeo(){confirmed=true;store("ec_geo",JSON.stringify({det:DET,c:cc()}))}

function t(k){return T[k][lang==="zh"?0:1]}
function L(p){return p[lang==="zh"?0:1]}
function nm(c){return C[c][lang]}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}

  limb(150,116,147,154,20,RT)+                                  /* 大腿（小腿被患者挡住） */
  limb(110,58,107,128,11,RSD)+                                  /* 远侧手臂 */
  P("M137 124 L96 72 C91 62 99 50 111 48 C116 48 120 50 123 54 L163 104 C167 114 160 125 149 127 C144 127 140 126 137 124 Z",RS)+
  P("M140 118 C150 120 158 114 160 106 L163 104 C167 114 160 125 149 127 C144 127 140 126 137 124 Z",RT)+
  P("M101 52 L97 40 L105 37 L110 49 Z",SKD)+                    /* 颈 */
  E(95,31,12,13.5,SK)+
  P("M83 27 C84 16 100 13 107 22 C109 27 108 33 104 34 C101 27 93 25 88 30 C86 32 84 31 83 27 Z",HR)+
  P("M84 35 L79 38 L84 39 Z",SK)+eye(88,30)+
  '</g>';
  return g+limb(108,56,106,96,13,RS)+limb(106,96,106,128,11,SK)+       /* 近侧手臂：伸直 */
  P("M93 130 C93 125 119 125 120 130 L120 139 C108 141 98 141 93 139 Z",hand||SK)+
  P("M95 128 C101 124 113 124 118 128 L116 132 C110 130 102 130 96 132 Z",hand?GLD:SKD)+

/* 反馈：Google 表单 + 腾讯问卷；大陆优先腾讯，其余优先 Google；都没填则复制文字 */
function fbCtx(c){return VERSION+" · "+c+" · "+lang}
function fbBlock(c){
  var g=FEEDBACK_GOOGLE,q=FEEDBACK_TENCENT;
  if(!g&&!q)return '<textarea id="fbTxt" rows="3" aria-label="'+esc(t("fbA"))+'" placeholder="'+esc(t("fbPh"))+'"></textarea><button class="btn" id="fbBtn">'+t("fbSend")+'</button><div class="muted" id="fbMsg" role="status"></div>';
  if(g&&GOOGLE_PREFILL_ENTRY)g+=(g.indexOf("?")<0?"?":"&")+"usp=pp_url&"+encodeURIComponent(GOOGLE_PREFILL_ENTRY)+"="+encodeURIComponent(fbCtx(c));
  var bg=g?'<a class="btn{K}" href="'+esc(g)+'" target="_blank" rel="noopener">'+t("fbG")+'</a>':"";
  var bq=q?'<a class="btn{K}" href="'+esc(q)+'" target="_blank" rel="noopener">'+t("fbT2")+'</a>':"";
  var list=(c==="CN")?[bq,bg]:[bg,bq];
  list=list.filter(function(x){return x});
  var h=list.map(function(x,i){return x.replace("{K}",i?" ghost":"")}).join("");
  return h+'<div class="muted" style="margin-top:10px">'+t("fbCtx")+'：<b>'+esc(fbCtx(c))+'</b><br>'+t("fbNoPII")+'</div>';
}

function renderId(editing){
  var box=$("idBox");if(!box)return;
  var d={};try{d=JSON.parse(load("ec_id")||"{}")}catch(e){}
  var F=[["name","fName"],["blood","fBlood"],["allergy","fAll"],["cond","fCond"],["med","fMed"],["ice","fIce"]];
  var has=F.some(function(f){return d[f[0]]});
  var h='<div class="muted">'+t("idHint")+'</div>';
  if(editing){
    h+=F.map(function(f){return '<label>'+t(f[1])+'<input data-f="'+f[0]+'" value="'+esc(d[f[0]]||"")+'" autocomplete="off"></label>'}).join("")+
       '<button class="btn" id="idSave">'+t("save")+'</button><button class="btn ghost" id="idClear">'+t("clear")+'</button>';
  }else{
    if(has)h+='<div class="idv">'+F.filter(function(f){return d[f[0]]}).map(function(f){return '<div><span>'+t(f[1])+'</span>'+esc(d[f[0]])+'</div>'}).join("")+'</div>';
    h+='<button class="btn ghost" id="idEdit">'+t("edit")+'</button>';
  }
  box.innerHTML=h;
}

/* ===================== 全屏层 ===================== */
var cur=null,lastFocus=null;
function showSheet(html,dockHtml,keepScroll){
  var s=$("sheet");
  if(!s.classList.contains("on"))lastFocus=document.activeElement;
  $("sheetBody").innerHTML=html;$("dock").innerHTML=dockHtml;
  s.classList.add("on");if(!keepScroll)s.scrollTop=0;document.body.style.overflow="hidden";
  $("app").setAttribute("aria-hidden","true");
  var h1=$("sheetT");if(h1&&!keepScroll)try{h1.focus({preventScroll:true})}catch(e){}
}
function closeSheet(){
  metroStop();awake(false);hush();cur=null;
  var s=$("sheet"),was=s.classList.contains("on");
  s.classList.remove("on");$("sheetBody").innerHTML="";$("dock").innerHTML=callBtn(cc());document.body.style.overflow="";
  $("app").removeAttribute("aria-hidden");
  if(was&&lastFocus&&document.contains(lastFocus))try{lastFocus.focus({preventScroll:true})}catch(e){}
}

/* 急救卡：执行模式（一屏一步）与全部步骤 */
function openCard(id){
  var k=CARDS.filter(function(x){return x.id===id})[0];if(!k){closeSheet();return}
  if(!cur||cur.k!==k){
    var v=load("ec_voice");
    cur={k:k,i:0,mode:load("ec_mode")==="list"?"list":"step",voice:v===null?!!k.metro:v==="1"};
  }
  awake(true);
  if(k.metro)metroStart();else metroStop();
  renderCard(false);
}
function stepPlain(k,i){return L(k.steps[i]).replace(/\{N\}/g,digits(C[cc()].amb))}
function renderCard(keep){
  var k=cur.k,c=cc(),N=C[c].amb,n=k.steps.length,i=cur.i,step=cur.mode==="step";
  function fill(s){return esc(s).replace(/\{N\}/g,'<b>'+esc(N)+'</b>')}
  var dont='<ul>'+k.dont.map(function(s){return '<li>'+esc(L(s))+'</li>'}).join("")+'</ul>';
  var h='<div class="shead"><button class="back" id="bk">‹ '+t("back")+'</button><span class="sp"></span>'+
    '<button class="chip" id="voiceBtn" aria-pressed="'+(cur.voice?"true":"false")+'" aria-label="'+esc(cur.voice?t("voiceOnA"):t("voiceOffA"))+'">'+emo(cur.voice?"🔊":"🔇")+' '+t("voice")+'</button>'+
    '<button class="chip" id="modeBtn">'+(step?t("modeList"):t("modeStep"))+'</button></div>'+
    '<h1 id="sheetT" tabindex="-1">'+emo(k.i)+' '+esc(k[lang])+'</h1>';
  if(k.metro)h+='<div class="metro"><div class="dot" id="dot" aria-hidden="true"></div><div class="ml">'+t("beatLbl")+'</div><button class="chip" id="sndBtn">'+sndLabel()+'</button></div>';
  h+='<div class="status" id="awk"'+(wl?'':' hidden')+'>'+emo("☀️")+' '+t("awake")+'</div><details class="when" id="noawk" style="margin-top:8px;padding:6px 12px"'+(wlFail?'':' hidden')+'><summary style="min-height:36px;display:flex;align-items:center;cursor:pointer">'+emo("⚠️")+'&nbsp;'+t("noAwakeS")+'</summary><div style="padding-bottom:6px">'+t("noAwake")+'</div></details>';
  if(step){
    h+='<div class="prog" aria-hidden="true">';
    for(var j=0;j<=n;j++)h+='<i'+(j<=i?' class="d"':'')+'></i>';
    h+='</div>';
    if(i<n){
      h+='<div aria-live="polite" aria-atomic="true"><div class="stepK">'+t("stepOf").replace("{a}",i+1).replace("{b}",n)+'</div>'+
         '<p class="stepTxt">'+fill(L(k.steps[i]))+'</p></div>'+fig(k.id,i)+
         (i===0?'<div class="when" style="margin-top:14px">'+esc(L(k.when))+'</div>':'')+
         '<details class="dd"><summary>✕ '+t("dontT")+'（'+k.dont.length+'）</summary>'+dont+'</details>';
    }else{
      h+='<div class="dont" aria-live="polite"><b>✕ '+t("dontT")+'</b>'+dont+'</div>'+
         (k.extra?'<div class="extra">'+esc(L(k.extra))+'</div>':'')+
         '<div class="src">'+t("srcT")+'：'+srcLine(k.src)+'</div>';
    }
  }else{
    h+='<div class="when" style="margin-top:10px">'+esc(L(k.when))+'</div>'+
      '<ol class="steps">'+k.steps.map(function(s,j){return '<li><span>'+fill(L(s))+fig(k.id,j)+'</span></li>'}).join("")+'</ol>'+
      '<div class="dont"><b>✕ '+t("dontT")+'</b>'+dont+'</div>'+
      (k.extra?'<div class="extra">'+esc(L(k.extra))+'</div>':'')+
      '<div class="src">'+t("srcT")+'：'+srcLine(k.src)+'</div>';
  }
  var nav=step?'<div class="snav"><button class="pv" id="pv"'+(i===0?' disabled':'')+'>‹ '+t("prev")+'</button>'+
    '<button class="nx" id="nx">'+(i<n?t("next")+' ›':t("finish"))+'</button></div>':'';
  showSheet(h,nav+callBtn(c),keep);
  if(keep)$("sheet").scrollTop=0;
  if(step&&cur.voice){
    if(i<n)say(stepPlain(k,i));
    else say(t("dontT")+"。"+k.dont.map(L).join(" "));
  }else hush();
}
function go(d){if(!cur)return;var n=cur.k.steps.length,i=cur.i+d;
  if(i>n){location.hash="";return}
  if(i<0)return;cur.i=i;renderCard(true)}

function openPicker(){
  metroStop();hush();cur=null;
  var h='<div class="shead"><button class="back" id="bk">‹ '+t("back")+'</button></div><h1 id="sheetT" tabindex="-1">'+t("pick")+'</h1>'+
    (DET!=="XX"?'<button class="btn ghost" data-pick="">'+t("useAuto")+'：'+emo(C[DET].f)+' '+esc(nm(DET))+'</button>':'')+'<div class="list">'+
    ORDER.map(function(c){return '<button class="opt" data-pick="'+c+'"><span>'+emo(C[c].f)+' '+esc(nm(c))+'</span><b>'+esc(C[c].amb)+'</b></button>'}).join("")+'</div>';
  showSheet(h,callBtn(cc()));
}
function openConfirm(){
  var c=DET,d=C[c],x=c==="XX";
  var h='<div class="cf"><div class="flag" aria-hidden="true">'+d.f+'</div>'+
    '<h1 id="sheetT" tabindex="-1">'+(x?t("cfX"):t("cfQ"))+'</h1>'+
    (x?'':'<div class="cn">'+esc(nm(c))+'</div>')+
    '<div class="an">'+t("ambLbl")+' <b>'+esc(d.amb)+'</b></div><p class="muted">'+t("cfS")+'</p>'+
    (x?'<button class="btn" id="cfN">'+t("cfXN")+'</button><button class="btn ghost" id="cfY">'+t("cfXY")+'</button>'
      :'<button class="btn" id="cfY">'+t("cfY")+'</button><button class="btn ghost" id="cfN">'+t("cfN")+'</button>')+
    '<p style="margin-top:18px"><button class="pill" id="langBtn2" aria-label="Switch language / 切换语言">'+(lang==="zh"?"English":"中文")+'</button></p></div>';
  showSheet(h,callBtn(c));
}
function route(){var h=location.hash.slice(1);
  if(h==="pick"){openPicker();return}
  if(!confirmed){openConfirm();return}
  if(h)openCard(h);else closeSheet()}
var skipHash=null;
function goHash(h){skipHash=h;location.hash=h;route()}
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(skipHash!==null&&h===skipHash){skipHash=null;return}skipHash=null;route()});

/* ===================== 心肺复苏节拍（110 次/分）、语音、屏幕常亮 ===================== */
var mt=null,ac=null,snd=load("ec_snd")!=="0";
function audio(){try{if(navigator.audioSession&&navigator.audioSession.type!=="playback")navigator.audioSession.type="playback"}catch(e){}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==="suspended"){var p=ac.resume();if(p&&p.then)p.then(sndShow,function(){})}}catch(e){ac=null}}
function sndLabel(){return !snd?emo("🔕")+" "+t("soundOff"):(ac&&ac.state==="running")?emo("🔔")+" "+t("soundOn"):emo("🔔")+" "+t("soundTap")}
function sndShow(){var b=$("sndBtn");if(b){var s=sndLabel();if(b.innerHTML!==s)b.innerHTML=s}}
function beat(){
  var d=$("dot");if(d){d.classList.remove("beat");void d.offsetWidth;d.classList.add("beat")}
  if(snd&&ac&&ac.state==="running"){try{var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.setValueAtTime(.35,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.1)}catch(e){}}
}
function metroStart(){if(mt)return;if(snd)audio();beat();mt=setInterval(beat,60000/110)}
function metroStop(){if(mt){clearInterval(mt);mt=null}}

function voiceFor(){try{var want=lang==="zh"?/^zh[-_](CN|Hans)/i:/^en[-_]GB/i,alt=lang==="zh"?/^zh/i:/^en/i,vs=speechSynthesis.getVoices()||[],v=null;
  for(var i=0;i<vs.length&&!v;i++)if(want.test(vs[i].lang))v=vs[i];for(i=0;i<vs.length&&!v;i++)if(alt.test(vs[i].lang))v=vs[i];return v}catch(e){return null}}
function say(s){try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(s);u.lang=lang==="zh"?"zh-CN":"en-GB";var v=voiceFor();if(v)u.voice=v;u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function hush(){try{if("speechSynthesis" in window)speechSynthesis.cancel()}catch(e){}}
/* 在用户点击的那一刻预先解锁声音（iPhone 要求声音由点击触发） */
function prime(){audio();try{if("speechSynthesis" in window&&!speechSynthesis.speaking){var u=new SpeechSynthesisUtterance(lang==="zh"?"好":"ok");u.volume=0;u.rate=2;speechSynthesis.speak(u)}}catch(e){}}

var wl=null,wlWant=false,wlFail=false;
/* iOS 18.4 之前，从主屏幕图标打开时常亮接口不起作用（WebKit bug 254545），按不支持处理 */
function wlBroken(){var m=/OS (\d+)_(\d+)/.exec(navigator.userAgent||"");if(!m||!standalone()||!/iPhone|iPad|iPod/.test(navigator.userAgent))return false;var v=+m[1]+m[2]/100;return v<18.04}
function awkShow(){var a=$("awk");if(a)a.hidden=!wl;var b=$("noawk");if(b)b.hidden=!(wlFail&&!wl)}
function awake(on){
  wlWant=on;
  if(!on){if(wl){try{wl.release()}catch(e){}wl=null}awkShow();return}
  if(wl)return;
  if(!("wakeLock" in navigator)||wlBroken()){wlFail=true;awkShow();return}
  try{navigator.wakeLock.request("screen").then(function(l){
    if(!wlWant){try{l.release()}catch(e){}return}
    wl=l;wlFail=false;awkShow();l.addEventListener("release",function(){if(wl===l)wl=null;awkShow()})},function(){wlFail=true;awkShow()})}catch(e){wlFail=true;awkShow()}
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&wlWant&&cur)awake(true)});

function copyText(s,done){
  function ok(){if(done)done()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(ok,fallback)}else fallback();
  function fallback(){try{var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();ok()}catch(e){}}
}

/* ===================== 事件 ===================== */
document.addEventListener("click",function(e){
  var el=e.target.closest("button,[data-card]");if(!el)return;
  if(el.id==="langBtn"||el.id==="langBtn2"){lang=lang==="zh"?"en":"zh";store("ec_lang",lang);render();return}
  if(el.id==="chg"||el.id==="cfN"){location.hash="pick";return}
  if(el.id==="cfY"){manual=null;saveGeo();render();return}
  if(el.id==="bk"){
    if(!confirmed){history.replaceState(null,"",location.pathname+location.search);openConfirm();return}
    if(history.length>1)history.back();else location.hash="";return}
  if(el.dataset.tri){tri=+el.dataset.tri;$("tri").innerHTML=triHtml();
    if(tri===2){var ch=$("cardsH");try{ch.scrollIntoView({behavior:"smooth",block:"start"});ch.focus({preventScroll:true})}catch(x){}}
    else try{$("triQ").focus({preventScroll:true})}catch(x){}
    return}
  if(el.dataset.go){prime();tri=0;$("tri").innerHTML=triHtml();goHash(el.dataset.go);return}
  if(el.dataset.card){prime();goHash(el.dataset.card);return}
  if(el.hasAttribute("data-pick")){manual=el.dataset.pick||null;if(manual===DET)manual=null;saveGeo();
    history.replaceState(null,"",location.pathname);closeSheet();render();window.scrollTo(0,0);return}
  if(el.id==="pv"){go(-1);return}
  if(el.id==="nx"){go(1);return}
  if(el.id==="modeBtn"){cur.mode=cur.mode==="step"?"list":"step";store("ec_mode",cur.mode);renderCard(false);return}
  if(el.id==="voiceBtn"){cur.voice=!cur.voice;store("ec_voice",cur.voice?"1":"0");if(cur.voice)prime();renderCard(true);return}
  if(el.id==="sndBtn"){
    if(snd&&!(ac&&ac.state==="running"))audio();else{snd=!snd;store("ec_snd",snd?"1":"0");if(snd)audio()}
    sndShow();setTimeout(sndShow,300);return}
  if(el.id==="instBtn"){if(dip){dip.prompt();dip=null;el.hidden=true}return}
  if(el.id==="idEdit"){renderId(true);return}
  if(el.id==="idSave"){var d={};document.querySelectorAll("#idBox [data-f]").forEach(function(i){if(i.value.trim())d[i.dataset.f]=i.value.trim()});store("ec_id",JSON.stringify(d));renderId(false);return}
  if(el.id==="idClear"){store("ec_id",null);renderId(false);return}
  if(el.id==="locBtn"){
    var out=$("locOut");
    if(!navigator.geolocation){out.innerHTML='<div class="muted">'+t("locFail")+'</div>';return}
    out.innerHTML='<div class="muted">'+t("locing")+'</div>';
    navigator.geolocation.getCurrentPosition(function(p){
      var s=p.coords.latitude.toFixed(5)+", "+p.coords.longitude.toFixed(5);
      out.innerHTML='<div class="loc">'+s+'</div><div class="muted">'+t("acc")+' '+Math.round(p.coords.accuracy)+' '+t("m")+'</div>'+
        '<button class="btn" id="locCopy" data-v="'+s+'">'+t("copy")+'</button>'+
        '<a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps?q='+encodeURIComponent(s)+'">'+t("map")+'</a>';
    },function(){out.innerHTML='<div class="muted">'+t("locFail")+'</div>'},{enableHighAccuracy:true,timeout:15000,maximumAge:30000});
    return}
  if(el.id==="locCopy"){copyText(el.dataset.v,function(){el.textContent=t("copied")});return}
  if(el.id==="fbBtn"){
    var v=($("fbTxt").value||"").trim();if(!v)return;
    var msg="[Emergency Card "+VERSION+"] "+cc()+"/"+lang+"\n"+v;
    if(navigator.share){navigator.share({text:msg}).catch(function(){})}
    copyText(msg,function(){$("fbMsg").textContent=t("fbDone")});
  }
});
document.addEventListener("keydown",function(e){
  if(!$("sheet").classList.contains("on"))return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||""))return;
  if(e.key==="Escape"){var b=$("bk");if(b)b.click()}
  else if(cur&&cur.mode==="step"){if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)}
});

render();
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
</script>
</body>
